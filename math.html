<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekenen oefenen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1838; --fg: #f3f7ff; --muted: #b8c7ea;
    --accent: #ffcf40; --accent-ink: #3a2200; --chip: rgba(8, 20, 52, 0.78);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #060f26; --chip: rgba(4, 12, 34, 0.82); } }
  :root[data-theme="dark"] { --bg: #060f26; --chip: rgba(4, 12, 34, 0.82); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  #app { position: relative; width: 100%; height: 100%; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #vr { pointer-events: auto; font: 900 1.15rem/1 "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px;
    padding: 0.9em 1.6em; box-shadow: 0 4px 0 var(--accent-shadow, #b77900); cursor: pointer; }
  #vr:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #vr[hidden] { display: none; }
  /* phones are played upright: held sideways, this covers the game */
  #turn { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px; background: var(--bg); color: var(--fg); text-align: center;
    font: 900 1.6rem/1.3 "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  #turn[hidden] { display: none; }
  #turn .phone { font-size: 4.5rem; animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(-90deg); } 55%, 100% { transform: rotate(0deg); } }
  @media (prefers-reduced-motion: reduce) { #turn .phone { animation: none; } }
  #note { pointer-events: auto; margin: 0; max-width: 34rem; text-align: center; font-size: 0.95rem;
    line-height: 1.4; color: var(--muted); background: var(--chip); padding: 0.5em 0.9em; border-radius: 12px; }
</style>
</head>
<body>
<div id="turn" hidden><div class="phone" aria-hidden="true">📱</div><p>Draai je telefoon rechtop</p></div>
<div id="app">
  <div id="hud">
    <button id="vr" hidden>🥽 Speel in VR</button>
    <p id="note" hidden></p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="settings.js"></script>
<script src="themes.js"></script>
<script src="progress.js"></script>
<script src="mathsettings.js"></script>
<script>
/* =====================================================================
   THE MATH SETTINGS are in mathsettings.js, next to this file: which
   divisors and number ranges she can choose from, remainders, the hint
   list and how many sums per game. Below are only the game settings.
   ===================================================================== */
/* Monster mode: monsters carrying the answers walk towards you; hit the right one!
   MONSTER_SPEED: 1 = normal, 0.7 = calmer, 1.4 = faster.
   LIVES: how often a monster may reach you before the game is over. */
const MONSTER_SPEED = 1;
const LIVES = 3;
/* Visits and scores go to your Google Sheet: the link is in settings.js.
   Event names and fields (g: 'rekenen', 'bezoek', goed, …) are the sheet's data. */
const logGame = (e, extra) => logEvent(e, Object.assign({ g: 'rekenen' }, extra));
logGame('bezoek');
</script>
<script>
(async function () {
  try {
    await Promise.all([document.fonts.load('900 64px Nunito'), document.fonts.load('800 48px Nunito'), document.fonts.load('700 40px Nunito')]);
  } catch (e) {}
  start();
})();

function start() {
  const FONT = '"Nunito", "Trebuchet MS", system-ui, sans-serif';
  const C = THEME.ui, W = THEME.words;

  // ---------- what to practise ----------
  // levels: sheet = the value logged to the Google Sheet
  const LEVELS = [
    { key: 'guided', sheet: 'hulplijst', button: '📝 Met hulplijst', text: 'Je hulplijst staat al klaar.' },
    { key: 'build',  sheet: 'zelf',      button: '✏️ Zelf maken',     text: 'Maak eerst zelf je hulplijst.' },
    { key: 'mental', sheet: 'hoofd',     button: '🧠 Uit je hoofd',   text: 'Zonder hulplijst, alleen het antwoord.' }
  ];
  const CFG = (function (c) {
    c = c || {};
    const ints = (a, min) => (Array.isArray(a) ? a : []).map(x => Math.round(Number(x))).filter(x => x >= min);
    const divisors = [...new Set(ints(c.divisors, 2))].sort((a, b) => a - b);
    const ranges = (Array.isArray(c.ranges) ? c.ranges : []).map(r => ints(r, 1)).filter(r => r.length === 2)
      .map(([a, b]) => [Math.min(a, b), Math.min(Math.max(a, b), 1000000)]);
    const chosen = c.chosen || {};
    const hints = {};
    Object.keys(c.hints || {}).forEach(d => { const h = [...new Set(ints(c.hints[d], 1))].sort((a, b) => b - a); if (h.length) hints[d] = h; });
    return {
      divisors: divisors.length ? divisors : [5], ranges: ranges.length ? ranges : [[100, 1000]],
      chosenDivisors: ints(chosen.divisors, 2), chosenRanges: (Array.isArray(chosen.ranges) ? chosen.ranges : []).filter(Array.isArray).map(r => r.join('-')),
      rest: !!c.remainders, count: Math.max(1, Math.min(50, Math.round(Number(c.count) || 10))), hints
    };
  })(typeof MATH === 'object' && MATH ? MATH.division : null);
  const rangeKey = r => r.join('-');
  const nl = n => n.toLocaleString('nl-NL');   // 10000 → 10.000
  // what she picked on the start screen (at least one divisor and one range); remembered per device
  let pickDivs = new Set(), pickRanges = new Set(), levelIdx = 0;
  function loadPicks() {
    let d = null, r = null, lv = null;
    try { d = JSON.parse(localStorage.getItem('math-divisors') || 'null'); r = JSON.parse(localStorage.getItem('math-ranges') || 'null'); lv = localStorage.getItem('math-level'); } catch (e) {}
    const okD = (Array.isArray(d) ? d : CFG.chosenDivisors).filter(x => CFG.divisors.includes(x));
    const okR = (Array.isArray(r) ? r : CFG.chosenRanges).filter(k => CFG.ranges.some(x => rangeKey(x) === k));
    pickDivs = new Set(okD.length ? okD : [CFG.divisors.includes(5) ? 5 : CFG.divisors[0]]);
    pickRanges = new Set(okR.length ? okR : [rangeKey(CFG.ranges[0])]);
    levelIdx = Math.max(0, LEVELS.findIndex(l => l.key === lv));
    loadBest();
  }
  function savePicks() {
    try { localStorage.setItem('math-divisors', JSON.stringify([...pickDivs])); localStorage.setItem('math-ranges', JSON.stringify([...pickRanges])); } catch (e) {}
    loadBest();
  }
  const chosenDivs = () => CFG.divisors.filter(d => pickDivs.has(d));
  const chosenRanges = () => CFG.ranges.filter(r => pickRanges.has(rangeKey(r)));
  // the hint list for a divisor: every "digit × 1, 10, 100, …" that fits the biggest chosen number
  function hintsFor(d) {
    if (CFG.hints[d]) return CFG.hints[d].slice();
    const maxQ = Math.floor(Math.max(...chosenRanges().map(r => r[1])) / d), out = [];
    for (let p = 1; p <= maxQ; p *= 10) for (let k = 1; k <= 9; k++) if (k * p <= maxQ) out.push(k * p);
    return out.sort((a, b) => b - a);
  }
  // SET is the sum being worked on: its divisor and hint list change with every sum
  const SET = { d: 5, hints: [], rest: CFG.rest, count: CFG.count };
  function useDivisor(d) { SET.d = d; SET.hints = hintsFor(d); }
  // the sums of a game: each takes a random chosen divisor and a number from a random chosen range
  function makeProblems() {
    const divs = chosenDivs(), ranges = chosenRanges(), out = [], seen = new Set();
    for (let tries = 0; out.length < SET.count && tries < SET.count * 50; tries++) {
      const d = divs[Math.floor(Math.random() * divs.length)], [lo, hi] = ranges[Math.floor(Math.random() * ranges.length)];
      const from = Math.max(lo, d), n = SET.rest ? from + Math.floor(Math.random() * (hi - from + 1))
        : d * (Math.ceil(from / d) + Math.floor(Math.random() * (Math.floor(hi / d) - Math.ceil(from / d) + 1)));
      if (n < from || n > hi || seen.has(n + ':' + d)) continue;
      seen.add(n + ':' + d); out.push({ n, d, repeat: false });
    }
    return out;
  }
  // logged as e.g. "5+10 | 100-1000"
  const setName = () => `${chosenDivs().join('+')} | ${chosenRanges().map(rangeKey).join('+')}`;
  const level = () => LEVELS[levelIdx].key;
  function useLevel(i) {
    levelIdx = Math.max(0, Math.min(LEVELS.length - 1, i));
    try { localStorage.setItem('math-level', LEVELS[levelIdx].key); } catch (e) {}
    loadBest();
  }
  const playable = () => chosenDivs().length > 0 && chosenRanges().length > 0;

  const app = document.getElementById('app');
  const vrBtn = document.getElementById('vr');
  const note = document.getElementById('note');

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  app.insertBefore(renderer.domElement, app.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
  const updateScenery = THEME.scene(THREE, scene);   // sky, ground and weather come from themes.js

  // ---------- canvas helpers ----------
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(ctx, text, maxW, size, weight) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > 14);
    return s;
  }
  function wrap(ctx, text, maxW) {
    const words = text.split(' '), lines = []; let line = '';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line); return lines;
  }
  // text in at most `maxLines` lines, shrinking the font until it fits
  function fitLines(ctx, text, maxW, maxLines, size, weight, minSize) {
    let s = size, lines;
    while (true) {
      ctx.font = `${weight} ${s}px ${FONT}`;
      lines = wrap(ctx, text, maxW);
      if ((lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW)) || s <= minSize) break;
      s -= 2;
    }
    return { lines: lines.slice(0, maxLines), size: s };
  }

  const interactive = [];
  function canvasPlane(w, h, cw) {
    const c = document.createElement('canvas'); c.width = cw; c.height = Math.round(cw * h / w);
    const ctx = c.getContext('2d'), tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, fog: false }));
    return { mesh, c, ctx, tex, update() { tex.needsUpdate = true; } };
  }
  const BTN_COLORS = C.btn;
  function makeButton(w, h, cw, maxLines) {
    const p = canvasPlane(w, h, cw);
    p.enabled = true; p.state = 'idle'; p.base = 1; p.mesh.userData.btn = p;
    p.draw = function (label, state) {
      this.state = state;
      const { ctx, c } = this, [a, b] = BTN_COLORS[state], r = Math.min(42, c.height * 0.3);
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(ctx, 8, 14, c.width - 16, c.height - 18, r); ctx.fill();
      const g = ctx.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, a); g.addColorStop(1, b);
      ctx.fillStyle = g; rr(ctx, 8, 6, c.width - 16, c.height - 20, r); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 5; ctx.stroke();
      ctx.fillStyle = state === 'start' ? C.startInk : '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const ml = maxLines || 1, inner = c.height - 34;
      const f = fitLines(ctx, label, c.width - 60, ml, Math.min(72, inner * (ml === 1 ? 0.62 : 0.42)), ml === 1 ? 900 : 800, 20);
      const lh = f.size * 1.12, y0 = (c.height - 14) / 2 + 2 - (f.lines.length - 1) * lh / 2;
      f.lines.forEach((l, i) => ctx.fillText(l, c.width / 2, y0 + i * lh));
      this.update();
    };
    interactive.push(p.mesh);
    return p;
  }

  // ---------- game UI ----------
  // Two layouts. Wide (computer, tablet, landscape, VR): the big panel (Q) holds the hint list on the
  // left and the worksheet on the right, the question along the bottom, the answers in one row below.
  // Tall (phone held upright): worksheet on top, hint list in the middle, question at the bottom,
  // the answers 2 × 2 below it. The panel is rebuilt when the layout changes.
  const ui = new THREE.Group(); scene.add(ui);
  const Z = -2.4;
  const S = canvasPlane(1.5, 0.19, 1024); ui.add(S.mesh);
  let Q = null, QW = 0, QH = 0, tall = false;
  const TALL_TOP = 2.71, TALL_MPP = 1.1 / 1024;   // tall panel: top edge (m) and metres per canvas pixel
  function buildPanel() {
    if (Q) { ui.remove(Q.mesh); Q.mesh.geometry.dispose(); Q.tex.dispose(); Q.mesh.material.dispose(); }
    Q = tall ? canvasPlane(1.1, 1.42, 1024) : canvasPlane(1.96, 1.2, 1280);
    ui.add(Q.mesh); QW = Q.c.width; QH = Q.c.height;
  }
  const answerBtns = [];
  for (let i = 0; i < 4; i++) {
    const b = makeButton(0.46, 0.28, 512, 2); b.index = i;
    b.onSelect = () => answer(b); ui.add(b.mesh); answerBtns.push(b);
  }
  const levelBtns = LEVELS.map((lv, i) => {
    const b = makeButton(0.62, 0.22, 640, 1);
    b.onSelect = () => { sfx('click'); useLevel(i); drawLevelBtns(); drawStart(); };
    ui.add(b.mesh); return b;
  });
  const calmBtn = makeButton(0.95, 0.28, 512, 1);
  calmBtn.onSelect = () => { if (!playable()) return; sfx('click'); newGame('calm'); }; ui.add(calmBtn.mesh);
  const monBtn = makeButton(0.95, 0.28, 512, 1);
  monBtn.onSelect = () => { if (!playable()) return; sfx('click'); newGame('monsters'); }; ui.add(monBtn.mesh);
  // start screen: toggle buttons for the divisors and the number ranges (several may be on, at least one stays on)
  const toggle = (set, key) => { if (!set.has(key)) set.add(key); else if (set.size > 1) set.delete(key); else return false; return true; };
  const divBtns = CFG.divisors.map(d => {
    const b = makeButton(0.17, 0.13, 256, 1); b.key = d;
    b.onSelect = () => { if (toggle(pickDivs, d)) { sfx('click'); savePicks(); drawPicks(); drawStart(); } };
    ui.add(b.mesh); return b;
  });
  const rangeBtns = CFG.ranges.map(r => {
    const b = makeButton(0.5, 0.13, 640, 1), k = rangeKey(r); b.key = k;
    b.onSelect = () => { if (toggle(pickRanges, k)) { sfx('click'); savePicks(); drawPicks(); drawStart(); } };
    ui.add(b.mesh); return b;
  });
  function drawPicks() {
    divBtns.forEach(b => b.draw(String(b.key), pickDivs.has(b.key) ? 'start' : 'idle'));
    rangeBtns.forEach((b, i) => b.draw(`${nl(CFG.ranges[i][0])}–${nl(CFG.ranges[i][1])}`, pickRanges.has(b.key) ? 'start' : 'idle'));
  }
  // home: during a game back to the start screen, on the start screen back to all games
  const homeBtn = makeButton(0.5, 0.12, 512, 1); ui.add(homeBtn.mesh);
  // after a finished sum: read the answer in peace, then click on (the clock is stopped meanwhile)
  const continueBtn = makeButton(0.7, 0.24, 640, 1); continueBtn.mesh.visible = false; ui.add(continueBtn.mesh);
  continueBtn.onSelect = () => { if (!continueBtn.mesh.visible || phase !== 'question') return; sfx('click'); continueBtn.mesh.visible = false; resumeClock(); nextStep(); };
  homeBtn.onSelect = () => {
    sfx('click');
    if (phase !== 'start') { goHome(); return; }
    try { if (session) session.end(); } catch (e) {}
    location.href = 'index.html';
  };
  function drawLevelBtns() { levelBtns.forEach((b, i) => b.draw(LEVELS[i].button, i === levelIdx ? 'start' : 'idle')); }
  function showModeButtons(on) {
    calmBtn.mesh.visible = monBtn.mesh.visible = on;
    // on a phone the level is chosen on the start screen only, so the end screen has room for the result
    levelBtns.forEach(b => b.mesh.visible = on && (!tall || phase === 'start'));
    // the choices only on the start screen; "Nog een keer" plays the same choice again
    divBtns.concat(rangeBtns).forEach(b => b.mesh.visible = on && phase === 'start');
    if (on) { calmBtn.draw('📖 Rustig oefenen', 'start'); monBtn.draw(`${W.monsterIcon} ${W.monsters}`, 'good'); drawLevelBtns(); }
    if (on) drawPicks();
  }

  function panelBg(ctx, c, r) {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = C.panel; rr(ctx, 6, 6, c.width - 12, c.height - 12, r); ctx.fill();
    ctx.strokeStyle = C.edge; ctx.lineWidth = 6; ctx.stroke();
  }
  function drawScore() {
    const { ctx, c } = S; panelBg(ctx, c, 60);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffffff';
    const life = mode === 'monsters' ? '     ' + '❤️'.repeat(Math.max(0, hearts)) + '🤍'.repeat(Math.max(0, LIVES - hearts)) : '';
    const txt = `⭐ ${score}     ✅ ${solved}/${total}     🔥 ${streak}     ⏱ ${fmtTime(elapsed())}${life}`;
    fit(ctx, txt, c.width - 80, 58, 800); ctx.fillText(txt, c.width / 2, c.height / 2 + 2); S.update();
  }

  let best = 0;
  function loadBest() { try { best = parseInt(localStorage.getItem(setKey() + '-score') || '0', 10) || 0; } catch (e) { best = 0; } }

  // the start screen: what to practise (the toggle buttons lie on top of this panel) and the level
  // canvas y of the two button rows, for [wide, tall]; place() puts the buttons there
  const PICK_ROWS = { wide: [250, 420], tall: [248, 378, 572] };
  function drawStart() {
    const { ctx, c } = Q, cx = QW / 2; panelBg(ctx, c, 56);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const mw = QW - 80, line = (txt, y, size, weight) => { fit(ctx, txt, mw, size, weight); ctx.fillText(txt, cx, y); };
    ctx.fillStyle = C.accent; line('Delen', tall ? 82 : 100, tall ? 88 : 100, 900);
    ctx.fillStyle = C.muted; line('Delen door:', tall ? 152 : 178, 46, 800);
    line('Getallen:', tall ? 494 : 348, 46, 800);
    if (tall) { Q.update(); return; }   // on a phone the level buttons cover the rest of the panel
    ctx.fillStyle = '#ffffff'; line(LEVELS[levelIdx].text, 530, 54, 800);
    const bc = bestTime('calm'), bm = bestTime('monsters'), times = [bc && `rustig ${fmtTime(bc)}`, bm && `monsters ${fmtTime(bm)}`].filter(Boolean);
    ctx.fillStyle = C.text;
    line(`${SET.count} sommen${SET.rest ? ', met rest' : ''}${times.length ? '   ⏱ snelste: ' + times.join(', ') : ''}`, 610, 48, 800);
    ctx.fillStyle = C.tip; line('Haal er steeds het grootste stuk uit je hulplijst af!', 700, 46, 800);
    Q.update();
  }

  // ---------- drawing a step: hint list, worksheet, question ----------
  const hintRow = m => `${m} × ${SET.d} = ${m * SET.d}`;
  // the hint list in two wide columns: 10 and up on the left, the ones on the right
  // (a long column is split at 12 rows), so the text can be big
  function hintColumns() {
    const cols = [];
    [SET.hints.filter(m => m >= 10), SET.hints.filter(m => m < 10)].forEach(list => {
      for (let i = 0; i < list.length; i += 12) cols.push(list.slice(i, i + 12));
    });
    return cols;
  }
  function drawHints(ctx, x0, w, top, bottom, header) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    if (header) {
      ctx.fillStyle = C.accent; ctx.font = `900 46px ${FONT}`;
      ctx.fillText(level() === 'build' ? '✏️ Jouw hulplijst' : '📝 Hulplijst', x0 + w / 2, top - 18);
    }
    const cols = hintColumns(), colW = w / cols.length, maxRows = Math.max(...cols.map(c => c.length));
    const rh = Math.min(64, (bottom - top) / maxRows), size = Math.round(rh * 0.8);
    const now = step && step.kind === 'hint' ? step.m : prob && prob.pending ? prob.pending : 0;
    cols.forEach((rows, ci) => rows.forEach((m, ri) => {
      const x = x0 + ci * colW, y = top + ri * rh, known = level() !== 'build' || !!(filled[SET.d] && filled[SET.d].has(m));
      if (m === now) {
        ctx.fillStyle = 'rgba(255,215,80,0.22)'; rr(ctx, x + 4, y + 2, colW - 8, rh - 4, 12); ctx.fill();
        ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.stroke();
      }
      const txt = known ? hintRow(m) : `${m} × ${SET.d} = …`;
      ctx.fillStyle = m === now ? C.accent : known ? '#ffffff' : C.muted;
      fit(ctx, txt, colW - 16, size, 800); ctx.textBaseline = 'middle';
      ctx.fillText(txt, x + colW / 2, y + rh / 2 + 1); ctx.textBaseline = 'alphabetic';
    }));
  }

    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function sfx(kind) {
    ensureAudio();
    if (kind === 'click') tone(620, 0, 0.12, 'sine', 0.15);
    if (kind === 'good') { tone(660, 0, 0.18, 'triangle', 0.22); tone(880, 0.1, 0.18, 'triangle', 0.22); tone(1320, 0.2, 0.3, 'triangle', 0.2); }
    if (kind === 'bad') { tone(260, 0, 0.22, 'square', 0.07); tone(196, 0.16, 0.32, 'square', 0.07); }
    if (kind === 'boing') { tone(330, 0, 0.18, 'sine', 0.3); tone(220, 0.1, 0.22, 'sine', 0.28); tone(150, 0.22, 0.3, 'sine', 0.25); }
    if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.35, 'triangle', 0.2));
  }
  function noiseBurst(dur, f0, f1, vol) {
    if (!actx) return;
    const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    const t = actx.currentTime, g = actx.createGain();
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(g).connect(actx.destination); src.start(t); src.stop(t + dur + 0.02);
  }

  // ---------- confetti ----------
  const parts = [];
  const partGeo = new THREE.OctahedronGeometry(0.022);
  const partMats = C.confetti.map(c => new THREE.MeshBasicMaterial({ color: c, transparent: true, fog: false }));
  function burst(obj) {
    const p = new THREE.Vector3(); if (obj && obj.isVector3) p.copy(obj); else obj.getWorldPosition(p);
    for (let i = 0; i < 36; i++) {
      const m = new THREE.Mesh(partGeo, partMats[i % partMats.length].clone()); m.position.copy(p);
      m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 2.2, Math.random() * 2 + 0.6, (Math.random() - 0.3) * 1.4);
      m.userData.life = 1.2; scene.add(m); parts.push(m);
    }
  }

  // ---------- input ----------
  const raycaster = new THREE.Raycaster();
  const tmpM = new THREE.Matrix4(), tmpV = new THREE.Vector3(), tmpD = new THREE.Vector3();
  function hitFromRay() {
    const list = interactive.filter(m => m.visible);
    creatures.forEach(cr => { if (cr.alive) cr.g.traverse(m => { if (m.isMesh) list.push(m); }); });
    const hits = raycaster.intersectObjects(list, false); return hits.length ? hits[0] : null;
  }
  function selectHit(hit) {
    if (!hit) return;
    if (hit.object.userData.creature) { shootCreature(hit.object.userData.creature, hit.point); return; }
    const b = hit.object.userData.btn; if (b && b.enabled && b.onSelect) b.onSelect();
  }

  const controllers = [];
  let lastSource = null;
  for (let i = 0; i < 2; i++) {
    const c = renderer.xr.getController(i);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
      new THREE.LineBasicMaterial({ color: C.ray, transparent: true, opacity: 0.8 }));
    line.scale.z = 4; c.add(line);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.015, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false })); dot.visible = false; scene.add(dot);
    c.userData = { line, dot, src: null };
    c.addEventListener('connected', e => { c.userData.src = e.data; });
    c.addEventListener('disconnected', () => { c.userData.src = null; dot.visible = false; });
    c.addEventListener('select', () => throwSnowball(c));
    scene.add(c); controllers.push(c);
    const grip = renderer.xr.getControllerGrip(i);
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.03, 0.12), new THREE.MeshLambertMaterial({ color: 0xdfe8ff })); body.position.z = 0.02; grip.add(body); scene.add(grip);
  }
  function rayFromController(c) {
    tmpM.identity().extractRotation(c.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
  }
  function buzz(intensity, ms) { try { const h = lastSource && lastSource.gamepad && lastSource.gamepad.hapticActuators; if (h && h[0]) h[0].pulse(intensity, ms); } catch (e) {} }

  // ---------- snowballs (VR only) ----------
  const snowballs = [];
  const ballGeo = new THREE.SphereGeometry(0.035, 16, 12), ballMat = new THREE.MeshLambertMaterial({ color: C.ball, emissive: C.ballGlow });
  const puffGeo = new THREE.IcosahedronGeometry(0.018, 0), puffMats = C.puff.map(c => new THREE.MeshBasicMaterial({ color: c, transparent: true, fog: false }));
  const stateKey = () => `${phase}|${stepNo}`;
  function snowPuff(point) {
    for (let i = 0; i < 16; i++) {
      const m = new THREE.Mesh(puffGeo, puffMats[i % puffMats.length].clone()); m.position.copy(point);
      m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 1.6, Math.random() * 1.2, (Math.random() - 0.2) * 1.2);
      m.userData.life = 0.7; scene.add(m); parts.push(m);
    }
  }
  function throwSnowball(c) {
    ensureAudio(); lastSource = c.userData.src;
    rayFromController(c);
    const hit = hitFromRay();
    const from = raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, 0.08);
    const to = hit ? hit.point.clone() : raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, 6);
    const dist = from.distanceTo(to), ball = new THREE.Mesh(ballGeo, ballMat);
    ball.position.copy(from); scene.add(ball);
    snowballs.push({ ball, from, to, t: 0, dur: Math.max(0.18, dist / 7), arc: Math.min(0.35, dist * 0.08), hit, key: stateKey() });
    noiseBurst(0.22, 900, 2500, 0.18); buzz(0.25, 30);
  }
  function updateSnowballs(dt) {
    for (let i = snowballs.length - 1; i >= 0; i--) {
      const s = snowballs[i]; s.t += dt / s.dur; const k = Math.min(1, s.t);
      s.ball.position.lerpVectors(s.from, s.to, k); s.ball.position.y += 4 * s.arc * k * (1 - k); s.ball.rotation.x += dt * 12;
      if (k >= 1) {
        scene.remove(s.ball); snowballs.splice(i, 1); snowPuff(s.to);
        if (s.hit) { noiseBurst(0.14, 500, 180, 0.35); if (s.key === stateKey()) selectHit(s.hit); }
      }
    }
  }

  const mouse = new THREE.Vector2(); let mouseIn = false;
  function setMouse(e) {
    const r = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1; mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1; mouseIn = true;
  }
  renderer.domElement.addEventListener('pointermove', setMouse);
  renderer.domElement.addEventListener('pointerleave', () => { mouseIn = false; });
  renderer.domElement.addEventListener('pointerdown', e => {
    if (renderer.xr.isPresenting) return;
    ensureAudio(); setMouse(e); raycaster.setFromCamera(mouse, camera); selectHit(hitFromRay());
  });

  // ---------- VR session ----------
  let session = null, needsPlace = false;
  async function setupVR() {
    const isHeadset = /OculusBrowser|Quest|Pico|Wolvic/i.test(navigator.userAgent);
    let ok = false;
    if (isHeadset) { try { ok = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-vr')); } catch (e) {} }
    if (ok) { vrBtn.hidden = false; note.hidden = false; note.textContent = `Druk op "Speel in VR". Richt op een antwoord en gooi een ${W.ball} met de trekker.`; }
    else vrBtn.hidden = true;   // no VR: nothing to explain, kids know how to tap
  }
  vrBtn.addEventListener('click', async () => {
    ensureAudio();
    if (session) { session.end(); return; }
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
      s.addEventListener('end', () => { session = null; vrBtn.textContent = '🥽 Speel in VR'; ui.position.set(0, 0, 0); ui.rotation.set(0, 0, 0); resize(); });
      await renderer.xr.setSession(s);
      session = s; needsPlace = true; vrBtn.textContent = 'Stop VR'; checkLayout(); place();
    } catch (e) { note.hidden = false; note.textContent = 'VR start niet. Open deze pagina direct in de Meta Quest-browser.'; }
  });

  // ---------- layout / loop ----------
  // a phone held sideways gets "Draai je telefoon rechtop" (tablets, computers and VR don't)
  const turnEl = document.getElementById('turn');
  function checkTurn() {
    const phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
    turnEl.hidden = !(phone && innerWidth > innerHeight && !renderer.xr.isPresenting);
  }
  function resize() {
    checkTurn();
    const w = app.clientWidth, h = app.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    checkLayout();
    const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    if (mode === 'monsters' && phase === 'question') {
      const dist = Math.max(3.6, 1.0 / (tanHalf * camera.aspect));
      camera.position.set(0, 1.8, Z + dist);
      // the panel covers the top of the screen; tilt the camera up so the top of the
      // highest sign of a monster that's still far away (7 m) shows just under the panel
      camera.updateProjectionMatrix(); camera.lookAt(0, 1.8, Z - 10); placeHud();
      const far = Z + dist + 7 + (tall ? PHONE_BACK : 0), top = 1.38 + SIGN_H * (tall ? phoneSignScale(far) * 2.06 : 1.55);
      const elev = Math.atan2(top - 1.8, far), want = Math.atan((hudBottom - 0.03) * tanHalf);
      const pitch = elev - want;
      camera.lookAt(0, 1.8 + Math.tan(pitch) * 10, Z + dist - 10); camera.updateProjectionMatrix();
      placeHud(); return;
    }
    // start/end: everything from the set selector (y 0.58) up to the home button (y 2.96) must fit;
    // during a game only the "Volgende" button (y 0.78) up to the home button, so it's a bit closer
    // phone: from the lowest button up to the home button, 1.16 m wide
    const playing = phase === 'question';
    const lo = !tall ? (playing ? 0.74 : 0.76) : playing ? 0.56 : 0.66;
    const hi = tall ? 3.08 : 3.05, wide = tall ? 1.16 : 2.06;
    const dist = Math.max(((hi - lo) / 2) / tanHalf, (wide / 2) / (tanHalf * camera.aspect)), mid = (hi + lo) / 2;
    camera.position.set(0, mid, Z + dist); camera.lookAt(0, mid, Z); camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', () => { if (!renderer.xr.isPresenting) resize(); });
  resize();

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (renderer.xr.isPresenting && needsPlace) {
      const xc = renderer.xr.getCamera(camera); xc.getWorldPosition(tmpV);
      if (tmpV.y > 0.3) {
        xc.getWorldDirection(tmpD); ui.rotation.y = Math.atan2(-tmpD.x, -tmpD.z);
        ui.position.set(tmpV.x, Math.max(-0.7, Math.min(0.2, tmpV.y - 1.6)), tmpV.z); needsPlace = false;
      }
    }
    const hovered = new Set();
    if (renderer.xr.isPresenting) {
      controllers.forEach(c => {
        const { line, dot, src } = c.userData;
        if (!src) { line.visible = false; return; }
        line.visible = true; rayFromController(c);
        const hit = hitFromRay();
        if (hit) { hovered.add(hit.object); line.scale.z = hit.distance; dot.position.copy(hit.point); dot.visible = true; }
        else { line.scale.z = 4; dot.visible = false; }
      });
    } else if (mouseIn) {
      raycaster.setFromCamera(mouse, camera);
      const hit = hitFromRay(); if (hit) hovered.add(hit.object);
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
    interactive.forEach(m => {
      const b = m.userData.btn;
      let target = hovered.has(m) && b.state !== 'dim' && b.enabled && !locked ? 1.04 : 1;
      if (b === waitBtn || b === continueBtn) target = 1.03 + Math.sin(t * 7) * 0.025;
      target *= b.base;
      const s = m.scale.x + (target - m.scale.x) * Math.min(1, dt * 14); m.scale.set(s, s, 1);
    });
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i], v = p.userData.v;
      v.y -= 3.2 * dt; p.position.addScaledVector(v, dt); p.rotation.x += dt * 6; p.rotation.y += dt * 4;
      p.userData.life -= dt; p.material.opacity = Math.max(0, p.userData.life / 1.2);
      if (p.userData.life <= 0) { scene.remove(p); p.material.dispose(); parts.splice(i, 1); }
    }
    updateScenery(dt, t);
    if (phase === 'question') { const e = elapsed(); if (e !== lastShownSec) { lastShownSec = e; drawScore(); } }
    updateSnowballs(dt);
    updateCreatures(dt, t);
    renderer.render(scene, camera);
  });

  loadPicks();
  showStart();
  setupVR();
}
</script>
</body>
