<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoofdsteden van Europa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
  :root {
    --bg: #0a1838;
    --fg: #f3f7ff;
    --muted: #b8c7ea;
    --accent: #ffcf40;
    --accent-ink: #3a2200;
    --chip: rgba(8, 20, 52, 0.78);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #060f26; --chip: rgba(4, 12, 34, 0.82); }
  }
  :root[data-theme="dark"] { --bg: #060f26; --chip: rgba(4, 12, 34, 0.82); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  #app { position: relative; width: 100%; height: 100%; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 16px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #vr {
    pointer-events: auto;
    font: 900 1.15rem/1 "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 999px; padding: 0.9em 1.6em;
    box-shadow: 0 4px 0 var(--accent-shadow, #b77900); cursor: pointer;
  }
  #vr:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #vr[hidden] { display: none; }
  #note {
    pointer-events: auto; margin: 0; max-width: 34rem; text-align: center;
    font-size: 0.95rem; line-height: 1.4; color: var(--muted);
    background: var(--chip); padding: 0.5em 0.9em; border-radius: 12px;
  }
  #hudRow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="hudRow">
      <button id="vr" hidden>🥽 Speel in VR</button>
    </div>
    <p id="note" hidden></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="settings.js"></script>
<script src="themes.js"></script>
<script src="progress.js"></script>
<script>
/* =====================================================================
   MEMORY AIDS (shown to the players, so in Dutch)
   One memory aid per country below (max. ~110 characters), keyed by the
   country's Dutch name. Leave empty = the game only shows "land → hoofdstad".
   For an apostrophe write \' (e.g. 'Het \'s nachts koud').
   ===================================================================== */
const HINTS = {
  'Noorwegen':  'Een slome OS LOopt op de WEG naar het NOORden.',
  'Zweden':     'Zwaai met een STOK tot je gaat ZWEten.',
  'Denemarken': 'In DENEmarken ga je LEGO KOPEN. LEGO komt echt uit Denemarken!',
  'IJsland':    'Wie IJS verkoopt, wordt RIJK.',
  'Finland':    'Een vis met een VIN roept: HELP, IK ZINK!',
  'Estland':    'Tante LINN is de bESTe!',
  'Letland':    'LET op! RIJ GAuw weg!',
  'Litouwen':   'Ik WIL een NIEUW springTOUW!',

  'Polen':      'WAAR SJOUW je die magneet met twee POLEN heen?',
  'Tsjechië':   'Ik CHECK in bij het hotel en PRAAT met de receptie.',
  'Slowakije':  'Dat geBRAAD IS LAVA-heet, eet het maar SLOW!',
  'Hongarije':  'Ik heb HONGER! Geef mij een BOEterham met PESTo.',
  'Kroatië':    'Een KROkodil ZAG een GREppel.',
  'Servië':     'BELGRADO betekent "witte stad": zo wit als een SERVET.',
  'Roemenië':   'Dracula leest een BOEK. De REST bewaart hij voor morgennacht.',
  'Bulgarije':  'De BULdog van tante SOFIA.',
  'Oekraïne':   'Een KIEVIT vliegt over OEKRAÏNE.',
  'Belarus':    'In WIT-RUSLAND ligt witte sneeuw en vriest het MIN tien: MINSK!',
  'Rusland':    'In RUSLAND is zelfs het MOS KOUd.'
};

/* How many times is every country asked per game? (wrongly answered questions come
   back once more, those don't count extra). 2 gives 16 questions for Noord-Europa
   and 22 for Oost-Europa. */
const QUESTION_ROUNDS = 2;

/* Which kinds of questions are in the game? Remove a line to switch that kind off.
   Every round each country gets one question, with a random kind from this list. */
const QUESTION_TYPES = [
  'country-to-capital',   // "Wat is de hoofdstad van Noorwegen?"
  'capital-to-country',   // "Van welk land is Oslo de hoofdstad?"
  'map-country',          // "Tik op Noorwegen op de kaart"
  'map-capital'           // "Tik op de stip van Oslo op de kaart"
];
/* Visits and scores go to your Google Sheet (the link is in settings.js); event names are the sheet's data, keep them. */
const logGame = (e, s) => logEvent(e, { s: s == null ? '' : String(s) });
logGame('bezoek');
</script>
<script>
(async function () {
  try {
    await Promise.all([
      document.fonts.load('900 64px Nunito'),
      document.fonts.load('800 48px Nunito'),
      document.fonts.load('700 40px Nunito')
    ]);
  } catch (e) {}
  start();
})();

function start() {
  const FONT = '"Nunito", "Trebuchet MS", system-ui, sans-serif';
  const C = THEME.ui;
  // flag codes are unique over all regions, the maps and hints are keyed by them
  const REGIONS = {
    north: { name: 'Noord-Europa', bestKey: 'capitals-best', data: [
      { country: 'Noorwegen',  capital: 'Oslo',       flag: 'no' },
      { country: 'Zweden',     capital: 'Stockholm',  flag: 'se' },
      { country: 'Denemarken', capital: 'Kopenhagen', flag: 'dk' },
      { country: 'IJsland',    capital: 'Reykjavik',  flag: 'is' },
      { country: 'Finland',    capital: 'Helsinki',   flag: 'fi' },
      { country: 'Estland',    capital: 'Tallinn',    flag: 'ee' },
      { country: 'Letland',    capital: 'Riga',       flag: 'lv' },
      { country: 'Litouwen',   capital: 'Vilnius',    flag: 'lt' }
    ] },
    // older textbooks use the names in brackets, so both are shown
    east: { name: 'Oost-Europa', bestKey: 'capitals-best-east', data: [
      { country: 'Polen',                 capital: 'Warschau',    flag: 'pl' },
      { country: 'Tsjechië',              capital: 'Praag',       flag: 'cz' },
      { country: 'Slowakije',             capital: 'Bratislava',  flag: 'sk' },
      { country: 'Hongarije',             capital: 'Boedapest',   flag: 'hu' },
      { country: 'Kroatië',               capital: 'Zagreb',      flag: 'hr' },
      { country: 'Servië',                capital: 'Belgrado',    flag: 'rs' },
      { country: 'Roemenië',              capital: 'Boekarest',   flag: 'ro' },
      { country: 'Bulgarije',             capital: 'Sofia',       flag: 'bg' },
      { country: 'Oekraïne',              capital: 'Kyiv (Kiev)', flag: 'ua' },
      { country: 'Belarus (Wit-Rusland)', capital: 'Minsk',       flag: 'by' },
      { country: 'Rusland',               capital: 'Moskou',      flag: 'ru' }
    ] }
  };
  let region = 'north', DATA = REGIONS.north.data;

  const app = document.getElementById('app');
  const vrBtn = document.getElementById('vr');
  const note = document.getElementById('note');

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  app.insertBefore(renderer.domElement, app.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
  const updateScenery = THEME.scene(THREE, scene);   // sky, ground and weather come from themes.js

  // ---------- canvas helpers ----------
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(ctx, text, maxW, size, weight) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > 14);
    return s;
  }
  function wrap(ctx, text, maxW) {
    const words = text.split(' '), lines = []; let line = '';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line); return lines;
  }
  function drawFlag(ctx, code, x, y, w, h) {
    ctx.save();
    rr(ctx, x, y, w, h, Math.min(w, h) * 0.08); ctx.clip();
    const nordic = (bg, c1, t1, c2, t2) => {
      ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
      const cx = x + w * 0.37, cy = y + h / 2;
      ctx.fillStyle = c1; ctx.fillRect(cx - h * t1 / 2, y, h * t1, h); ctx.fillRect(x, cy - h * t1 / 2, w, h * t1);
      if (c2) { ctx.fillStyle = c2; ctx.fillRect(cx - h * t2 / 2, y, h * t2, h); ctx.fillRect(x, cy - h * t2 / 2, w, h * t2); }
    };
    const stripes = (cols, parts) => {
      parts = parts || cols.map(() => 1);
      const tot = parts.reduce((a, b) => a + b, 0); let yy = y;
      cols.forEach((c, i) => { const hh = h * parts[i] / tot; ctx.fillStyle = c; ctx.fillRect(x, yy, w, hh + 1); yy += hh; });
    };
    const vstripes = cols => cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x + w * i / cols.length, y, w / cols.length + 1, h); });
    // simple coat-of-arms shield: flat top, rounded point at the bottom
    const shield = (cx, top, sw, sh) => {
      ctx.beginPath(); ctx.moveTo(cx - sw / 2, top); ctx.lineTo(cx + sw / 2, top); ctx.lineTo(cx + sw / 2, top + sh * 0.55);
      ctx.quadraticCurveTo(cx + sw / 2, top + sh * 0.9, cx, top + sh); ctx.quadraticCurveTo(cx - sw / 2, top + sh * 0.9, cx - sw / 2, top + sh * 0.55);
      ctx.closePath();
    };
    switch (code) {
      case 'dk': nordic('#C8102E', '#FFFFFF', 0.2); break;
      case 'se': nordic('#006AA7', '#FECC02', 0.2); break;
      case 'fi': nordic('#FFFFFF', '#002F6C', 0.26); break;
      case 'no': nordic('#BA0C2F', '#FFFFFF', 0.27, '#00205B', 0.13); break;
      case 'is': nordic('#02529C', '#FFFFFF', 0.27, '#DC1E35', 0.13); break;
      case 'ee': stripes(['#0072CE', '#000000', '#FFFFFF'], [1, 1, 1]); break;
      case 'lv': stripes(['#9E3039', '#FFFFFF', '#9E3039'], [2, 1, 2]); break;
      case 'lt': stripes(['#FDB913', '#006A44', '#C1272D'], [1, 1, 1]); break;
      case 'pl': stripes(['#FFFFFF', '#DC143C']); break;
      case 'hu': stripes(['#CE2939', '#FFFFFF', '#477050']); break;
      case 'bg': stripes(['#FFFFFF', '#00966E', '#D62612']); break;
      case 'ru': stripes(['#FFFFFF', '#0039A6', '#D52B1E']); break;
      case 'ua': stripes(['#0057B7', '#FFD700']); break;
      case 'ro': vstripes(['#002B7F', '#FCD116', '#CE1126']); break;
      case 'cz':
        stripes(['#FFFFFF', '#D7141A']);
        ctx.fillStyle = '#11457E'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w / 2, y + h / 2); ctx.lineTo(x, y + h); ctx.fill();
        break;
      case 'by': {
        stripes(['#C8313E', '#4AA657'], [2, 1]);
        const sw = w * 0.11; ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x, y, sw, h);
        ctx.fillStyle = '#C8313E';
        for (let i = 0; i < 6; i++) {
          const cy = y + h * (i + 0.5) / 6, r = h / 14;
          ctx.beginPath(); ctx.moveTo(x + sw / 2, cy - r); ctx.lineTo(x + sw / 2 + sw * 0.32, cy); ctx.lineTo(x + sw / 2, cy + r); ctx.lineTo(x + sw / 2 - sw * 0.32, cy); ctx.fill();
        }
        break;
      }
      case 'sk': {
        stripes(['#FFFFFF', '#0B4EA2', '#EE1C25']);
        const cx = x + w * 0.34, top = y + h * 0.2, sw = w * 0.24, sh = h * 0.6;
        shield(cx, top, sw, sh); ctx.fillStyle = '#FFFFFF'; ctx.fill();
        shield(cx, top + sh * 0.04, sw * 0.86, sh * 0.92); ctx.fillStyle = '#EE1C25'; ctx.fill();
        ctx.save(); ctx.clip();
        ctx.fillStyle = '#0B4EA2'; ctx.beginPath(); ctx.arc(cx, top + sh * 1.05, sw * 0.42, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; const t = sw * 0.09;
        ctx.fillRect(cx - t / 2, top + sh * 0.12, t, sh * 0.58);
        ctx.fillRect(cx - sw * 0.2, top + sh * 0.24, sw * 0.4, t); ctx.fillRect(cx - sw * 0.28, top + sh * 0.42, sw * 0.56, t);
        ctx.restore();
        break;
      }
      case 'hr': {
        stripes(['#FF0000', '#FFFFFF', '#171796']);
        const cx = x + w / 2, top = y + h * 0.27, sw = w * 0.2, sh = h * 0.46, n = 5;
        shield(cx, top, sw, sh); ctx.fillStyle = '#FFFFFF'; ctx.fill();
        ctx.save(); ctx.clip(); ctx.fillStyle = '#FF0000';
        for (let r = 0; r < n + 2; r++) for (let q = 0; q < n; q++) if ((r + q) % 2 === 0) ctx.fillRect(cx - sw / 2 + q * sw / n, top + r * sw / n, sw / n + 0.5, sw / n + 0.5);
        ctx.restore();
        break;
      }
      case 'rs': {
        stripes(['#C6363C', '#0C4076', '#FFFFFF']);
        const cx = x + w * 0.33, top = y + h * 0.22, sw = w * 0.2, sh = h * 0.52, t = sw * 0.16;
        shield(cx, top, sw, sh); ctx.fillStyle = '#EDB92E'; ctx.fill();
        shield(cx, top + sh * 0.05, sw * 0.82, sh * 0.88); ctx.fillStyle = '#C6363C'; ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(cx - t / 2, top + sh * 0.14, t, sh * 0.66); ctx.fillRect(cx - sw * 0.3, top + sh * 0.38, sw * 0.6, t);
        break;
      }
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = Math.max(2, w * 0.02);
    rr(ctx, x, y, w, h, Math.min(w, h) * 0.08); ctx.stroke();
  }
  function starShape(ctx, cx, cy, r, filled) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = filled ? C.accent : 'rgba(255,255,255,0.12)'; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = filled ? C.accentLight : 'rgba(255,255,255,0.35)'; ctx.stroke();
  }

  const interactive = [];
  function canvasPlane(w, h, cw) {
    const c = document.createElement('canvas'); c.width = cw; c.height = Math.round(cw * h / w);
    const ctx = c.getContext('2d');
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, fog: false }));
    return { mesh, c, ctx, tex, update() { tex.needsUpdate = true; } };
  }
  const BTN_COLORS = C.btn;
  function makeButton(w, h) {
    const p = canvasPlane(w, h, 512);
    p.enabled = true; p.state = 'idle'; p.mesh.userData.btn = p;
    p.draw = function (label, state) {
      this.state = state;
      const { ctx, c } = this, [a, b] = BTN_COLORS[state];
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(ctx, 8, 16, c.width - 16, c.height - 20, 42); ctx.fill();
      const g = ctx.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, a); g.addColorStop(1, b);
      ctx.fillStyle = g; rr(ctx, 8, 6, c.width - 16, c.height - 22, 42); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 5; ctx.stroke();
      fit(ctx, label, c.width - 80, 68, 900);
      ctx.fillStyle = state === 'start' ? C.startInk : '#ffffff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, c.width / 2, (c.height - 16) / 2 + 4);
      this.update();
    };
    interactive.push(p.mesh);
    return p;
  }

  // ---------- game UI ----------
  const ui = new THREE.Group(); scene.add(ui);
  const Z = -2.4;

  const S = canvasPlane(1.3, 0.19, 1024); S.mesh.position.set(0, 2.56, Z); ui.add(S.mesh);
  const Q = canvasPlane(1.8, 1.0, 1024);  Q.mesh.position.set(0, 1.9, Z);  ui.add(Q.mesh);

  const answerBtns = [];
  [[-0.47, 1.2], [0.47, 1.2], [-0.47, 0.9], [0.47, 0.9]].forEach(([x, y], i) => {
    const b = makeButton(0.86, 0.26); b.mesh.position.set(x, y, Z + 0.08); b.index = i;
    b.onSelect = () => answer(b); ui.add(b.mesh); answerBtns.push(b);
  });
  const startBtn = makeButton(1.0, 0.3); startBtn.mesh.position.set(0, 1.05, Z + 0.08);
  startBtn.onSelect = () => { sfx('click'); newGame(); }; ui.add(startBtn.mesh);
  // start screen: pick a region, left and right below its flags
  const regionBtns = ['north', 'east'].map((key, i) => {
    const b = makeButton(0.86, 0.26); b.mesh.position.set(i ? 0.47 : -0.47, 1.1, Z + 0.08);
    b.region = key; b.onSelect = () => { sfx('click'); setRegion(key); newGame(); }; ui.add(b.mesh);
    return b;
  });
  // home: during a game back to the start screen, on the start screen back to all games
  const homeBtn = makeButton(0.3, 0.15); homeBtn.mesh.position.set(-0.84, 2.56, Z + 0.08);
  homeBtn.onSelect = () => { sfx('click'); goHome(); }; ui.add(homeBtn.mesh);

  const CAPITAL_DOTS = {

  const P = canvasPlane(1.8, 0.36, 1024); P.mesh.position.set(0, 2.27, Z); ui.add(P.mesh);

  P.mesh.visible = false; M.mesh.visible = false;
  const ringsToPath = rings => { const pth = new Path2D(); rings.forEach(r => { pth.moveTo(r[0], r[1]); for (let k = 2; k < r.length; k += 2) pth.lineTo(r[k], r[k + 1]); pth.closePath(); }); return pth; };
  let quizPaths = {}, otherPaths = [], byFlag = {}, CAPS = {};
  function setRegion(key) {
    region = key; DATA = REGIONS[key].data; CAPS = CAPITAL_DOTS[key];
    const md = MAPS[key];
    quizPaths = {}; Object.keys(md.quiz).forEach(f => { quizPaths[f] = ringsToPath(md.quiz[f]); });
    otherPaths = md.other.map(ringsToPath);
    byFlag = {}; DATA.forEach((d, i) => { byFlag[d.flag] = i; });
  }
  setRegion('north');
  let mapState = { hover: null, good: null, bad: null };

  function countryAt(x, y) {
    for (const f in quizPaths) if (M.ctx.isPointInPath(quizPaths[f], x, y, 'evenodd')) return f;
    return null;
  }
  function cityAt(x, y) {
    let best = null, bd = 48;
    for (const f in CAPS) { const d = Math.hypot(CAPS[f][0] - x, CAPS[f][1] - y); if (d < bd) { bd = d; best = f; } }
    return best;
  }
  function mapLabel(ctx, text, x, y, col, below) {
    ctx.font = `900 30px ${FONT}`;
    const w = ctx.measureText(text).width + 24;
    let lx = Math.min(Math.max(x - w / 2, 8), 1016 - w), ly = below ? y + 22 : y - 58;
    if (ly < 8) ly = y + 22;
    if (ly > 633) ly = y - 58;
    ctx.fillStyle = C.panel; rr(ctx, lx, ly, w, 42, 12); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, lx + 12, ly + 22);
  }
  function drawMap() {
    const { ctx, c } = M, cityMode = curDir === 'map-capital', MC = C.map;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.save(); rr(ctx, 4, 4, c.width - 8, c.height - 8, 30); ctx.clip();
    ctx.fillStyle = MC.sea; ctx.fillRect(0, 0, c.width, c.height);
    ctx.lineJoin = 'round';
    otherPaths.forEach(pth => { ctx.fillStyle = MC.other; ctx.fill(pth, 'evenodd'); ctx.strokeStyle = MC.otherEdge; ctx.lineWidth = 1.5; ctx.stroke(pth); });
    for (const f in quizPaths) {
      let col = MC.land;
      if (!cityMode) {
        if (f === mapState.good) col = '#46e591';
        else if (f === mapState.bad) col = '#ff7477';
        else if (f === mapState.hover) col = MC.hover;
      }
      ctx.fillStyle = col; ctx.fill(quizPaths[f], 'evenodd');
      ctx.strokeStyle = MC.border; ctx.lineWidth = 2; ctx.stroke(quizPaths[f]);
    }
    if (cityMode) {
      for (const f in CAPS) {
        const [x, y] = CAPS[f];
        let r = 11, col = '#ffffff';
        if (f === mapState.good) { r = 16; col = '#46e591'; }
        else if (f === mapState.bad) { r = 15; col = '#ff7477'; }
        else if (f === mapState.hover) { r = 15; col = C.accent; }
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = MC.sea; ctx.stroke();
      }
    }
    // after answering, name what was tapped and what was asked
    // two capitals close together: the lower one gets its label below its dot, so the labels don't overlap
    const near = mapState.good && mapState.bad &&
      Math.abs(CAPS[mapState.good][1] - CAPS[mapState.bad][1]) < 110 && Math.abs(CAPS[mapState.good][0] - CAPS[mapState.bad][0]) < 400;
    const show = (f, col, other) => {
      const d = DATA[byFlag[f]], [x, y] = CAPS[f];
      if (!cityMode) { ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fillStyle = MC.sea; ctx.fill(); }
      mapLabel(ctx, `${d.country}: ${d.capital}`, x, y, col, near && y >= CAPS[other][1]);
    };
    if (mapState.bad) show(mapState.bad, '#ff7477', mapState.good);
    if (mapState.good) show(mapState.good, '#46e591', mapState.bad);
    ctx.restore();
    ctx.strokeStyle = C.edge; ctx.lineWidth = 6; rr(ctx, 4, 4, c.width - 8, c.height - 8, 30); ctx.stroke();
    M.update();
  }
  function drawPrompt(fb) {
    const { ctx, c } = P, d = DATA[cur], cityMode = curDir === 'map-capital'; panelBg(ctx, c, 40);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    if (!fb) {
      ctx.fillStyle = C.muted; const t = cityMode ? 'Tik op de stip van de hoofdstad' : 'Tik op de kaart op het land';

      const big = cityMode ? d.capital : d.country;
      ctx.fillStyle = C.accent; fit(ctx, big, 900, 84, 900); ctx.fillText(big, 512, 160);
    } else {
      ctx.fillStyle = fb.good ? '#5cf0a0' : '#ff9a9d'; fit(ctx, fb.title, 920, 54, 900); ctx.fillText(fb.title, 512, 80);
      const h = (hints[d.flag] || '').trim();
      const line = h ? '💡 ' + h : (cityMode ? `${d.capital} → ${d.country}` : `${d.country} → ${d.capital}`);
      ctx.fillStyle = C.tip; fit(ctx, line, 940, 48, 800); ctx.fillText(line, 512, 154);
    }
    P.update();
  }

    ctx.clearRect(0, 0, c.width, c.height);

  function drawScore() {

    // hover
    const hovered = new Set();
    let mapHit = null;
    if (renderer.xr.isPresenting) {
      controllers.forEach(c => {
        const { line, dot, src } = c.userData;
        if (!src) { line.visible = false; return; }
        line.visible = true;
        rayFromController(c);
        const hit = hitFromRay();
        if (hit && hit.object === M.mesh) mapHit = hit;
        if (hit) { hovered.add(hit.object); line.scale.z = hit.distance; dot.position.copy(hit.point); dot.visible = true; }
        else { line.scale.z = 4; dot.visible = false; }
      });
    } else if (mouseIn) {
      raycaster.setFromCamera(mouse, camera);
      const hit = hitFromRay();
      if (hit) hovered.add(hit.object);
      if (hit && hit.object === M.mesh) mapHit = hit;
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
    if (phase === 'question' && isMapQ() && !locked && !waitMap) {
      let hv = null;
      if (mapHit && mapHit.uv) {
        const x = mapHit.uv.x * M.c.width, y = (1 - mapHit.uv.y) * M.c.height;
        hv = curDir === 'map-capital' ? cityAt(x, y) : countryAt(x, y);
      }
      if (hv !== mapState.hover) { mapState.hover = hv; drawMap(); }
    }
    interactive.forEach(m => {
      const b = m.userData.btn;
      let target = hovered.has(m) && b.state !== 'dim' && !locked ? 1.07 : 1;
      if (b === waitBtn) target = 1.06 + Math.sin(t * 7) * 0.04;
      const s = m.scale.x + (target - m.scale.x) * Math.min(1, dt * 14);
      m.scale.set(s, s, 1);
    });

    // confetti
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i], v = p.userData.v;
      v.y -= 3.2 * dt; p.position.addScaledVector(v, dt);
      p.rotation.x += dt * 6; p.rotation.y += dt * 4;
      p.userData.life -= dt; p.material.opacity = Math.max(0, p.userData.life / 1.2);
      if (p.userData.life <= 0) { scene.remove(p); p.material.dispose(); parts.splice(i, 1); }
    }

    updateScenery(dt, t);

    renderer.render(scene, camera);
    updateSnowballs(dt);
  });

  // ---------- hints from the HINTS config at the top ----------
  const hints = {};
  const byCountry = {};
  Object.values(REGIONS).forEach(R => R.data.forEach(d => {
    const name = d.country.toLowerCase();
    byCountry[name] = d.flag; byCountry[name.replace(/\s*\(.*\)$/, '')] = d.flag;
  }));
  function applyHints(map) {
    Object.keys(map).forEach(k => {
      const f = byCountry[String(k).trim().toLowerCase()];
      if (f) hints[f] = String(map[k] || '').trim().slice(0, 110);
    });
  }
  applyHints(typeof HINTS === 'object' && HINTS ? HINTS : {});

  showStart();
  setupVR();
}
</script>
</body>
</html>
