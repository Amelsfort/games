<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woorden oefenen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1838; --fg: #f3f7ff; --muted: #b8c7ea;
    --accent: #ffcf40; --accent-ink: #3a2200; --chip: rgba(8, 20, 52, 0.78);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #060f26; --chip: rgba(4, 12, 34, 0.82); } }
  :root[data-theme="dark"] { --bg: #060f26; --chip: rgba(4, 12, 34, 0.82); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  #app { position: relative; width: 100%; height: 100%; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #vr { pointer-events: auto; font: 900 1.15rem/1 "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px;
    padding: 0.9em 1.6em; box-shadow: 0 4px 0 var(--accent-shadow, #b77900); cursor: pointer; }
  #vr:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #vr[hidden] { display: none; }
  #note { pointer-events: auto; margin: 0; max-width: 34rem; text-align: center; font-size: 0.95rem;
    line-height: 1.4; color: var(--muted); background: var(--chip); padding: 0.5em 0.9em; border-radius: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button id="vr" hidden>🥽 Speel in VR</button>
    <p id="note">Laden…</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="settings.js"></script>
<script src="themes.js"></script>
<script src="wordlists.js"></script>
<script>
/* =====================================================================
   DE WOORDENLIJSTEN staan in het bestand wordlists.js, naast dit bestand.
   Daar kun je lijsten toevoegen, aanpassen en kiezen welke standaard opent.
   Hieronder staan alleen de spelinstellingen.
   ===================================================================== */

/* Hoeveel vragen per spel? 0 = elk woord één keer. Fout beantwoorde vragen komen
   daarna nog een keer terug; die tellen niet extra mee. */
const AANTAL_VRAGEN = 0;

/* Welke soorten vragen? Haal een regel weg om die soort uit te zetten. */
const VRAAGSOORTEN = [
  'woord-naar-betekenis',   // "Wat betekent nauwkeurig?"  → kies de betekenis
  'betekenis-naar-woord'    // "Welk woord betekent: heel precies?" → kies het woord
];

/* Monsters-modus: sneeuwmonsters met de antwoorden lopen op je af; raak het goede!
   MONSTER_SNELHEID: 1 = normaal, 0.7 = rustiger, 1.4 = sneller.
   LEVENS: hoe vaak een monster je mag bereiken voordat het spel voorbij is. */
const MONSTER_SNELHEID = 1;
const LEVENS = 3;

/* Bezoeken en scores bijhouden in je Google Sheet: de link staat in settings.js. */
const logGame = (e, extra) => logEvent(e, Object.assign({ g: 'woorden' }, extra));
logGame('bezoek');
</script>
<script>
(async function () {
  try {
    await Promise.all([document.fonts.load('900 64px Nunito'), document.fonts.load('800 48px Nunito'), document.fonts.load('700 40px Nunito')]);
  } catch (e) {}
  start();
})();

function start() {
  const FONT = '"Nunito", "Trebuchet MS", system-ui, sans-serif';
  const C = THEMA.ui, W = THEMA.words;
  const LISTS = (typeof WOORDENLIJSTEN === 'object' && WOORDENLIJSTEN) ? WOORDENLIJSTEN : {};
  const LIST_KEYS = Object.keys(LISTS).filter(k => LISTS[k] && Array.isArray(LISTS[k].woorden));
  const cleanWords = arr => arr
    .filter(w => w && String(w.woord || '').trim() && String(w.betekenis || '').trim())
    .map(w => ({ woord: String(w.woord).trim(), betekenis: String(w.betekenis).trim(), tip: String(w.tip || '').trim() }));
  let DATA = [], NOPT = 0, TITEL = 'Woorden', listIdx = 0;
  const listName = () => LIST_KEYS[listIdx] || '';
  function useList(i) {
    if (!LIST_KEYS.length) return;
    listIdx = ((i % LIST_KEYS.length) + LIST_KEYS.length) % LIST_KEYS.length;
    const L = LISTS[LIST_KEYS[listIdx]];
    DATA = cleanWords(L.woorden); NOPT = Math.min(4, DATA.length);
    TITEL = String(L.titel || LIST_KEYS[listIdx]);
    try { localStorage.setItem('woorden-lijst', LIST_KEYS[listIdx]); } catch (e) {}
    loadBest();
  }
  function startList() {
    const want = new URLSearchParams(location.search).get('lijst');
    let stored = null; try { stored = localStorage.getItem('woorden-lijst'); } catch (e) {}
    const std = typeof STANDAARD_LIJST === 'string' ? STANDAARD_LIJST : null;
    const pick = [want, std && !want ? std : null, stored, LIST_KEYS[LIST_KEYS.length - 1]].find(k => k && LIST_KEYS.includes(k));
    useList(Math.max(0, LIST_KEYS.indexOf(pick)));
  }

  const app = document.getElementById('app');
  const vrBtn = document.getElementById('vr');
  const note = document.getElementById('note');

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  app.insertBefore(renderer.domElement, app.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
  const updateScenery = THEMA.scene(THREE, scene);   // sky, ground and weather come from themes.js

  // ---------- canvas helpers ----------
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(ctx, text, maxW, size, weight) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > 14);
    return s;
  }
  function wrap(ctx, text, maxW) {
    const words = text.split(' '), lines = []; let line = '';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line); return lines;
  }
  // text in at most `maxLines` lines, shrinking the font until it fits
  function fitLines(ctx, text, maxW, maxLines, size, weight, minSize) {
    let s = size, lines;
    while (true) {
      ctx.font = `${weight} ${s}px ${FONT}`;
      lines = wrap(ctx, text, maxW);
      if ((lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW)) || s <= minSize) break;
      s -= 2;
    }
    return { lines: lines.slice(0, maxLines), size: s };
  }

  const interactive = [];
  function canvasPlane(w, h, cw) {
    const c = document.createElement('canvas'); c.width = cw; c.height = Math.round(cw * h / w);
    const ctx = c.getContext('2d'), tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, fog: false }));
    return { mesh, c, ctx, tex, update() { tex.needsUpdate = true; } };
  }
  const BTN_COLORS = C.btn;
  function makeButton(w, h, cw, maxLines) {
    const p = canvasPlane(w, h, cw);
    p.enabled = true; p.state = 'idle'; p.mesh.userData.btn = p;
    p.draw = function (label, state) {
      this.state = state;
      const { ctx, c } = this, [a, b] = BTN_COLORS[state], r = Math.min(42, c.height * 0.3);
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(ctx, 8, 14, c.width - 16, c.height - 18, r); ctx.fill();
      const g = ctx.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, a); g.addColorStop(1, b);
      ctx.fillStyle = g; rr(ctx, 8, 6, c.width - 16, c.height - 20, r); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 5; ctx.stroke();
      ctx.fillStyle = state === 'start' ? C.startInk : '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const ml = maxLines || 1, inner = c.height - 34;
      const f = fitLines(ctx, label, c.width - 70, ml, Math.min(64, inner * (ml === 1 ? 0.62 : 0.4)), ml === 1 ? 900 : 800, 20);
      const lh = f.size * 1.12, y0 = (c.height - 14) / 2 + 2 - (f.lines.length - 1) * lh / 2;
      f.lines.forEach((l, i) => ctx.fillText(l, c.width / 2, y0 + i * lh));
      this.update();
    };
    interactive.push(p.mesh);
    return p;
  }

  // ---------- game UI ----------
  const ui = new THREE.Group(); scene.add(ui);
  const Z = -2.4;
  const S = canvasPlane(1.5, 0.19, 1024); S.mesh.position.set(0, 2.66, Z); ui.add(S.mesh);
  const Q = canvasPlane(1.8, 0.9, 1024);  Q.mesh.position.set(0, 2.1, Z);  ui.add(Q.mesh);
  const answerBtns = [];
  [[-0.46, 1.38], [0.46, 1.38], [-0.46, 0.99], [0.46, 0.99]].forEach(([x, y], i) => {
    const b = makeButton(0.88, 0.37, 768, 5); b.mesh.position.set(x, y, Z + 0.08); b.index = i;
    b.onSelect = () => answer(b); ui.add(b.mesh); answerBtns.push(b);
  });
  const calmBtn = makeButton(0.95, 0.3, 512, 1); calmBtn.mesh.position.set(-0.51, 1.3, Z + 0.08);
  calmBtn.onSelect = () => { if (DATA.length < 2) return; sfx('click'); newGame('rustig'); }; ui.add(calmBtn.mesh);
  const monBtn = makeButton(0.95, 0.3, 512, 1); monBtn.mesh.position.set(0.51, 1.3, Z + 0.08);
  monBtn.onSelect = () => { if (DATA.length < 2) return; sfx('click'); newGame('monsters'); }; ui.add(monBtn.mesh);
  const prevBtn = makeButton(0.24, 0.22, 256, 1); prevBtn.mesh.position.set(-0.78, 0.98, Z + 0.08);
  const nextBtn = makeButton(0.24, 0.22, 256, 1); nextBtn.mesh.position.set(0.78, 0.98, Z + 0.08);
  const listLabel = canvasPlane(1.24, 0.2, 1024); listLabel.mesh.position.set(0, 0.98, Z + 0.08); ui.add(listLabel.mesh);
  prevBtn.onSelect = () => { sfx('click'); useList(listIdx - 1); drawStart(); drawListLabel(); };
  nextBtn.onSelect = () => { sfx('click'); useList(listIdx + 1); drawStart(); drawListLabel(); };
  ui.add(prevBtn.mesh); ui.add(nextBtn.mesh);
  function drawListLabel() {
    const { ctx, c } = listLabel; panelBg(ctx, c, 60);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const txt = `📚 Lijst ${listIdx + 1} van ${LIST_KEYS.length}: ${TITEL}`;
    fit(ctx, txt, c.width - 60, 58, 800); ctx.fillText(txt, c.width / 2, c.height / 2 + 2); listLabel.update();
  }
  function showModeButtons(on) {
    calmBtn.mesh.visible = monBtn.mesh.visible = on;
    const many = on && LIST_KEYS.length > 1;
    prevBtn.mesh.visible = nextBtn.mesh.visible = listLabel.mesh.visible = many;
    if (on) { calmBtn.draw('📖 Rustig oefenen', 'start'); monBtn.draw(`${W.monsterIcon} ${W.monsters}`, 'good'); }
    if (many) { prevBtn.draw('◀', 'idle'); nextBtn.draw('▶', 'idle'); drawListLabel(); }
  }

  function panelBg(ctx, c, r) {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = C.panel; rr(ctx, 6, 6, c.width - 12, c.height - 12, r); ctx.fill();
    ctx.strokeStyle = C.edge; ctx.lineWidth = 6; ctx.stroke();
  }
  function drawScore() {
    const { ctx, c } = S; panelBg(ctx, c, 60);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffffff';
    const life = mode === 'monsters' ? '     ' + '❤️'.repeat(Math.max(0, hearts)) + '🤍'.repeat(Math.max(0, LEVENS - hearts)) : '';
    const txt = `⭐ ${score}     ✅ ${solved}/${total}     🔥 ${streak}     ⏱ ${fmtTime(elapsed())}${life}`;
    fit(ctx, txt, c.width - 80, 58, 800); ctx.fillText(txt, c.width / 2, c.height / 2 + 2); S.update();
  }

  let best = 0;
  function loadBest() { try { best = parseInt(localStorage.getItem(listKey() + '-score') || '0', 10) || 0; } catch (e) { best = 0; } }

  function drawStart() {
    const { ctx, c } = Q; panelBg(ctx, c, 44);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.accent; fit(ctx, TITEL, c.width - 120, 112, 900); ctx.fillText(TITEL, 512, 140);
    ctx.fillStyle = '#ffffff'; ctx.font = `800 54px ${FONT}`; ctx.fillText('Wat betekent het?', 512, 215);
    ctx.fillStyle = C.text; ctx.font = `700 42px ${FONT}`;
    ctx.fillText(!LIST_KEYS.length ? 'wordlists.js niet gevonden' : DATA.length < 2 ? 'Zet minstens 2 woorden in deze lijst.' : `${DATA.length} woorden om te oefenen`, 512, 305);
    ctx.fillStyle = C.muted; ctx.font = `700 38px ${FONT}`;
    const bc = bestTime('rustig'), bm = bestTime('monsters');
    if (!bc && !bm) ctx.fillText('Kies hoe je wilt spelen 👇', 512, 380);
    else {
      if (bc) ctx.fillText(`Snelste tijd rustig: ${fmtTime(bc)}`, 512, 375);
      if (bm) ctx.fillText(`Snelste tijd monsters: ${fmtTime(bm)}`, 512, bc ? 430 : 375);
    }
    Q.update();
  }
  function drawQuestion(fb) {
    const { ctx, c } = Q, d = DATA[cur], toWord = curDir === 'b2w'; panelBg(ctx, c, 44);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.muted; ctx.font = `700 40px ${FONT}`;
    ctx.fillText(toWord ? 'Welk woord betekent:' : 'Wat betekent dit woord?', 512, 64);
    ctx.fillStyle = C.accent;
    if (toWord) {
      ctx.textBaseline = 'middle';
      const f = fitLines(ctx, d.betekenis, 920, 4, 64, 800, 26), lh = f.size * 1.18, y0 = 195 - (f.lines.length - 1) * lh / 2;
      f.lines.forEach((l, i) => ctx.fillText(l, 512, y0 + i * lh));
      ctx.textBaseline = 'alphabetic';
    } else {
      fit(ctx, d.woord, 920, 112, 900); ctx.fillText(d.woord, 512, 230);
    }
    ctx.strokeStyle = C.line; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(60, 312); ctx.lineTo(964, 312); ctx.stroke();
    if (!fb) {
      ctx.fillStyle = C.text; ctx.font = `700 42px ${FONT}`; ctx.fillText(mode === 'monsters' ? `Raak het goede ${W.monster}! ${W.monsterIcon}` : 'Kies het goede antwoord 👇', 512, 410);
    } else {
      ctx.fillStyle = fb.good ? '#5cf0a0' : '#ff9a9d'; fit(ctx, fb.title, 920, 48, 900); ctx.fillText(fb.title, 512, 368);
      ctx.fillStyle = C.tip;
      const line = d.tip ? '💡 ' + d.tip : (toWord ? `Het woord is: ${d.woord}` : `${d.woord} = ${d.betekenis}`);
      const f = fitLines(ctx, line, 900, 3, 38, 700, 22);
      f.lines.forEach((l, i) => ctx.fillText(l, 512, 420 + i * f.size * 1.15));
    }
    Q.update();
  }
  function starShape(ctx, cx, cy, r, filled) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); }
    ctx.closePath(); ctx.fillStyle = filled ? C.accent : 'rgba(255,255,255,0.12)'; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = filled ? C.accentLight : 'rgba(255,255,255,0.35)'; ctx.stroke();
  }
  function drawEnd(newBest, newTime, secs, lost) {
    const { ctx, c } = Q; panelBg(ctx, c, 44);
    if (lost) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#ff9a9d'; ctx.font = `900 84px ${FONT}`; ctx.fillText(W.caught, 512, 110);
      ctx.fillStyle = '#ffffff'; ctx.font = `800 48px ${FONT}`; ctx.fillText(`${solved} van ${total} vragen gehaald`, 512, 220);
      ctx.fillStyle = C.muted; ctx.font = `700 40px ${FONT}`; ctx.fillText(`${score} punten`, 512, 290);
      ctx.fillStyle = C.text; ctx.font = `700 38px ${FONT}`;
      ctx.fillText(W.tooFast, 512, 380); ctx.fillText('Probeer het nog eens!', 512, 432);
      Q.update(); return;
    }
    const stars = firstRight === total ? 3 : firstRight >= Math.ceil(total * 0.75) ? 2 : 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.accent; ctx.font = `900 84px ${FONT}`; ctx.fillText('Klaar! 🎉', 512, 100);
    [362, 512, 662].forEach((x, i) => starShape(ctx, x, 180, 46, i < stars));
    ctx.fillStyle = '#ffffff'; ctx.font = `800 46px ${FONT}`; ctx.fillText(`${firstRight} van ${total} meteen goed`, 512, 285);
    ctx.fillStyle = newTime ? '#5cf0a0' : '#ffffff'; ctx.font = `900 46px ${FONT}`;
    const bt = bestTime(mode);
    ctx.fillText(newTime ? `⏱ ${fmtTime(secs)}, nieuwe snelste tijd! 🏆` : `⏱ ${fmtTime(secs)} (snelste: ${fmtTime(bt)})`, 512, 350);
    ctx.fillStyle = C.muted; ctx.font = `700 38px ${FONT}`;
    ctx.fillText(newBest ? `${score} punten, nieuw record!` : `${score} punten (beste: ${best})`, 512, 410);
    ctx.fillStyle = C.text; ctx.font = `700 36px ${FONT}`;
    ctx.fillText(newTime ? 'Wauw, sneller dan ooit!' : stars === 3 ? 'Alles goed! Lukt het nog sneller?' : 'Goed geoefend! Nog een keer?', 512, 470);
    Q.update();
  }

  // ---------- timer ----------
  let startedAt = 0, endedAt = 0, lastShownSec = -1;
  const elapsed = () => !startedAt ? 0 : Math.floor(((endedAt || performance.now()) - startedAt) / 1000);
  const fmtTime = secs => `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  // fastest time is kept per word list and settings, so a new list starts fresh
  function listKey() {
    const src = JSON.stringify([DATA.map(d => [d.woord, d.betekenis]), AANTAL_VRAGEN, VRAAGSOORTEN]);
    let h = 5381; for (let i = 0; i < src.length; i++) h = ((h << 5) + h + src.charCodeAt(i)) | 0;
    return 'woorden-tijd-' + (h >>> 0).toString(36);
  }
  const timeKey = m => listKey() + (m === 'monsters' ? '-m' : '');
  function bestTime(m) { try { return parseInt(localStorage.getItem(timeKey(m || mode)) || '0', 10) || 0; } catch (e) { return 0; } }

  // ---------- game logic ----------
  const TYPE_MAP = { 'woord-naar-betekenis': 'w2b', 'betekenis-naar-woord': 'b2w' };
  let phase = 'start', queue = [], cur = -1, curDir = 'w2b', curId = 0, options = [], wrongOnce = new Set(), total = 0;
  let score = 0, streak = 0, solved = 0, firstRight = 0, locked = false, waitBtn = null;
  let mode = 'rustig', hearts = 0, requeued = false, waitCreature = null;
  function setLayout() {
    const mon = mode === 'monsters' && phase === 'question';
    Q.mesh.position.set(0, mon ? 2.6 : 2.1, Z); Q.mesh.scale.setScalar(mon ? 0.85 : 1);
    S.mesh.position.set(0, mon ? 3.08 : 2.66, Z);
    if (!renderer.xr.isPresenting) resize();
  }
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const label = i => curDir === 'b2w' ? DATA[i].woord : DATA[i].betekenis;

  function showStart() {
    phase = 'start';
    answerBtns.forEach(b => b.mesh.visible = false);
    clearCreatures(); showModeButtons(true);
    S.mesh.visible = false; setLayout(); drawStart();
  }
  function newGame(m) {
    mode = m === 'monsters' ? 'monsters' : 'rustig';
    hearts = Math.max(1, Math.round(Number(LEVENS) || 3));
    logGame('spel-gestart', { l: listName(), m: mode });
    const types = (Array.isArray(VRAAGSOORTEN) ? VRAAGSOORTEN : []).map(t => TYPE_MAP[t]).filter(Boolean);
    const pool = types.length ? types : ['w2b'];
    const n = Math.round(Number(AANTAL_VRAGEN) || 0);
    total = Math.max(1, Math.min(100, n > 0 ? n : DATA.length));
    const order = [];
    while (order.length < total) {
      const round = shuffle(DATA.map((_, i) => i));
      if (order.length && round[0] === order[order.length - 1]) round.push(round.shift());
      order.push(...round);
    }
    queue = order.slice(0, total).map((i, id) => ({ id, i, dir: pool[Math.floor(Math.random() * pool.length)] }));
    wrongOnce = new Set(); score = 0; streak = 0; solved = 0; firstRight = 0; locked = false; waitBtn = null;
    phase = 'question'; showModeButtons(false); S.mesh.visible = true; setLayout();
    startedAt = performance.now(); endedAt = 0; lastShownSec = -1;
    nextQuestion();
  }
  function nextQuestion() {
    if (!queue.length) return endGame();
    const item = queue.shift(); cur = item.i; curDir = item.dir; curId = item.id;

        const { line, dot, src } = c.userData;
        if (!src) { line.visible = false; return; }
        line.visible = true; rayFromController(c);
        const hit = hitFromRay();
        if (hit) { hovered.add(hit.object); line.scale.z = hit.distance; dot.position.copy(hit.point); dot.visible = true; }
        else { line.scale.z = 4; dot.visible = false; }
      });
    } else if (mouseIn) {
      raycaster.setFromCamera(mouse, camera);
      const hit = hitFromRay(); if (hit) hovered.add(hit.object);
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
    interactive.forEach(m => {
      const b = m.userData.btn;
      let target = hovered.has(m) && b.state !== 'dim' && !locked ? 1.04 : 1;
      if (b === waitBtn) target = 1.03 + Math.sin(t * 7) * 0.025;
      const s = m.scale.x + (target - m.scale.x) * Math.min(1, dt * 14); m.scale.set(s, s, 1);
    });
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i], v = p.userData.v;
      v.y -= 3.2 * dt; p.position.addScaledVector(v, dt); p.rotation.x += dt * 6; p.rotation.y += dt * 4;
      p.userData.life -= dt; p.material.opacity = Math.max(0, p.userData.life / 1.2);
      if (p.userData.life <= 0) { scene.remove(p); p.material.dispose(); parts.splice(i, 1); }
    }
    updateScenery(dt, t);
    if (phase === 'question') { const e = elapsed(); if (e !== lastShownSec) { lastShownSec = e; drawScore(); } }
    updateSnowballs(dt);
    updateCreatures(dt, t);
    renderer.render(scene, camera);
  });

  startList();
  showStart();
  setupVR();
}
</script>
