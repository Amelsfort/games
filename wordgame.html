<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woorden oefenen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1838; --fg: #f3f7ff; --muted: #b8c7ea;
    --accent: #ffcf40; --accent-ink: #3a2200; --chip: rgba(8, 20, 52, 0.78);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #060f26; --chip: rgba(4, 12, 34, 0.82); } }
  :root[data-theme="dark"] { --bg: #060f26; --chip: rgba(4, 12, 34, 0.82); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  #app { position: relative; width: 100%; height: 100%; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #vr { pointer-events: auto; font: 900 1.15rem/1 "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px;
    padding: 0.9em 1.6em; box-shadow: 0 4px 0 var(--accent-shadow, #b77900); cursor: pointer; }
  #vr:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #vr[hidden] { display: none; }
  /* phones are played upright: held sideways, this covers the game */
  #turn { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px; background: var(--bg); color: var(--fg); text-align: center;
    font: 900 1.6rem/1.3 "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  #turn[hidden] { display: none; }
  #turn .phone { font-size: 4.5rem; animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(-90deg); } 55%, 100% { transform: rotate(0deg); } }
  @media (prefers-reduced-motion: reduce) { #turn .phone { animation: none; } }
  #note { pointer-events: auto; margin: 0; max-width: 34rem; text-align: center; font-size: 0.95rem;
    line-height: 1.4; color: var(--muted); background: var(--chip); padding: 0.5em 0.9em; border-radius: 12px; }
</style>
</head>
<body>
<div id="turn" hidden><div class="phone" aria-hidden="true">📱</div><p>Draai je telefoon rechtop</p></div>
<div id="app">
  <div id="hud">
    <button id="vr" hidden>🥽 Speel in VR</button>
    <p id="note" hidden></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="settings.js"></script>
<script src="themes.js"></script>
<script src="progress.js"></script>
<script src="wordlists.js"></script>
<script>
/* =====================================================================
   THE WORD LISTS are in wordlists.js, next to this file.
   There you can add and edit subjects (with their parts and test date)
   and choose which subject opens the first time.
   Below are only the game settings.
   ===================================================================== */

/* How many questions per game? 0 = every word once. Questions answered wrongly
   come back once more afterwards; those don't count extra. */
const QUESTION_COUNT = 0;

/* Which kinds of questions? Remove a line to switch that kind off. */
const QUESTION_TYPES = [
  'word-to-meaning',   // "Wat betekent nauwkeurig?"  → pick the meaning
  'meaning-to-word'    // "Welk woord betekent: heel precies?" → pick the word
];

/* Monster mode: monsters carrying the answers walk towards you; hit the right one!
   MONSTER_SPEED: 1 = normal, 0.7 = calmer, 1.4 = faster.
   LIVES: how often a monster may reach you before the game is over. */
const MONSTER_SPEED = 1;
const LIVES = 3;

/* Visits and scores go to your Google Sheet: the link is in settings.js.
   Event names and fields (g: 'woorden', 'bezoek', goed, …) are the sheet's data: keep them. */
const logGame = (e, extra) => logEvent(e, Object.assign({ g: 'woorden' }, extra));
logGame('bezoek');
</script>
<script>
(async function () {
  try {
    await Promise.all([document.fonts.load('900 64px Nunito'), document.fonts.load('800 48px Nunito'), document.fonts.load('700 40px Nunito')]);
  } catch (e) {}
  start();
})();

function start() {
  const FONT = '"Nunito", "Trebuchet MS", system-ui, sans-serif';
  const C = THEME.ui, W = THEME.words;
  // the words are grouped by subject, every subject has one or more parts (see wordlists.js)
  const SUBJECTS = (typeof WORD_SUBJECTS === 'object' && WORD_SUBJECTS) ? WORD_SUBJECTS : {};
  const SUBJECT_KEYS = Object.keys(SUBJECTS).filter(k => SUBJECTS[k] && Array.isArray(SUBJECTS[k].parts) && SUBJECTS[k].parts.some(Array.isArray));
  const MAX_PARTS = 4;   // toggle buttons on the start screen
  const cleanWords = arr => (Array.isArray(arr) ? arr : [])
    .filter(w => w && String(w.word || '').trim() && String(w.meaning || '').trim())
    .map(w => ({ word: String(w.word).trim(), meaning: String(w.meaning).trim(), tip: String(w.tip || '').trim() }));
  let DATA = [], NOPT = 0, TITLE = 'Woorden', subjectIdx = 0, PARTS = [], pickParts = new Set([0]);
  const subjectKey = () => SUBJECT_KEYS[subjectIdx] || '';
  const partsName = () => [...pickParts].sort().map(i => i + 1).join('+');
  // what is logged to the sheet (field l), e.g. 'sport 1+2'
  const listName = () => subjectKey() + (PARTS.length > 1 ? ' ' + partsName() : '');
  function useParts() {
    DATA = [];
    [...pickParts].sort().forEach(i => { DATA = DATA.concat(PARTS[i] || []); });
    NOPT = Math.min(4, DATA.length);
    loadBest();
  }
  // selects the parts the practice plan suggests (see nextGoal); the player can change them freely
  function pickSuggested() {
    pickParts = new Set(nextGoal().parts.filter(j => j < PARTS.length));
    useParts();
  }
  function useSubject(i) {
    if (!SUBJECT_KEYS.length) return;
    subjectIdx = ((i % SUBJECT_KEYS.length) + SUBJECT_KEYS.length) % SUBJECT_KEYS.length;
    const L = SUBJECTS[subjectKey()];
    PARTS = L.parts.filter(Array.isArray).slice(0, MAX_PARTS).map(cleanWords);
    TITLE = String(L.title || subjectKey());
    try { localStorage.setItem('words-subject', subjectKey()); } catch (e) {}
    pickSuggested();
  }
  function startSubject() {
    const q = new URLSearchParams(location.search), want = q.get('subject') || q.get('list');
    let stored = null; try { stored = localStorage.getItem('words-subject'); } catch (e) {}
    const std = typeof DEFAULT_SUBJECT === 'string' ? DEFAULT_SUBJECT : null;
    const pick = [want, stored, std, SUBJECT_KEYS[0]].find(k => k && SUBJECT_KEYS.includes(k));
    useSubject(Math.max(0, SUBJECT_KEYS.indexOf(pick)));
  }

  // ---------- practice plan ----------
  // Every game is remembered per subject on this device ('words-plan-<subject>'): which parts, how
  // and how many were right first time. From that the start screen suggests what to practise today:
  // first every part on its own until it goes well, then all parts together, then with the monsters
  // (faster), and after that once a day until the test. Words that went wrong often are kept in
  // 'words-hard-<subject>' (+2 when wrong, -1 when right first time) and named as "Let op: …".
  const PLAN_KEEP = 80, GOOD = 0.9;   // results kept per subject; part of the questions right first time that counts as good
  const dayStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const loadJson = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v && typeof v === 'object' ? v : def; } catch (e) { return def; } };
  const saveJson = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const planLog = () => { const l = loadJson('words-plan-' + subjectKey(), []); return Array.isArray(l) ? l.filter(e => e && Array.isArray(e.p)) : []; };
  function recordPlan(m, good, n, lost, seen, missed) {
    const log = planLog();
    log.push({ p: [...pickParts].sort(), m, good, n, lost: !!lost, day: dayStr(new Date()) });
    saveJson('words-plan-' + subjectKey(), log.slice(-PLAN_KEEP));
    const hard = loadJson('words-hard-' + subjectKey(), {});
    seen.forEach(i => {
      const w = DATA[i].word, v = (hard[w] || 0) + (missed.has(i) ? 2 : -1);
      if (v > 0) hard[w] = Math.min(10, v); else delete hard[w];
    });
    saveJson('words-hard-' + subjectKey(), hard);
  }
  // days until the test of this subject (null: no date, or the test is over)
  function daysToTest() {
    const t = String((SUBJECTS[subjectKey()] || {}).test || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!t) return null;
    const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const day = new Date(+t[1], +t[2] - 1, +t[3]), d = Math.round((day - today) / 86400000);
    return d < 0 ? null : { d, day };
  }
  function testLine() {
    const t = daysToTest(); if (!t) return '';
    if (t.d === 0) return 'Vandaag is de toets. Succes! 🍀';
    if (t.d === 1) return 'Morgen is de toets! 🍀';
    const when = t.day.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    return `⏳ Nog ${t.d} dagen tot de toets (${when})`;
  }
  // ---- the plan: a ladder of goals that get harder, on practice days that spread out when it goes well
  const toDate = str => { const m = String(str).split('-'); return new Date(+m[0], +m[1] - 1, +m[2]); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const dayDiff = (a, b) => Math.round((b - a) / 86400000);
  const longDay = d => d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
  // 'vandaag', 'morgen', 'overmorgen' or a date like 'zaterdag 28 november'
  const dayName = d => {
    const now = new Date(), n = dayDiff(new Date(now.getFullYear(), now.getMonth(), now.getDate()), d);
    return n === 0 ? 'vandaag' : n === 1 ? 'morgen' : n === 2 ? 'overmorgen' : longDay(d);
  };
  // the first goal on the ladder that is not reached yet: { text, steps } (steps = how many goals are left)
  function nextGoal() {
    const log = planLog(), all = PARTS.map((_, i) => i), n = all.length;
    const count = parts => parts.reduce((a, i) => a + (PARTS[i] || []).length, 0);
    const atLeast = parts => Math.ceil(count(parts) * GOOD);
    const last = pred => { for (let i = log.length - 1; i >= 0; i--) if (!log[i].lost && pred(log[i])) return log[i]; return null; };
    const ratio = e => e ? e.good / Math.max(1, e.n) : 0;
    const both = n > 1 ? `Deel ${all.map(i => i + 1).join(' + ')}` : 'Alle woorden';
    const together = e => e.p.length === n, mon = W.monsters.toLowerCase();
    const best = bestTimeOf(all, 'monsters') || bestTimeOf(all, 'calm');
    const ladder = [];
    if (n > 1) all.forEach(i => ladder.push({ parts: [i], ok: ratio(last(e => e.p.includes(i))) >= GOOD, text: `Deel ${i + 1} rustig: minstens ${atLeast([i])} van ${count([i])} meteen goed` }));
    ladder.push({ parts: all, ok: ratio(last(together)) >= GOOD, text: `${both} rustig: minstens ${atLeast(all)} van ${count(all)} meteen goed` });
    ladder.push({ parts: all, ok: ratio(last(e => together(e) && e.m === 'calm')) >= 1 || ratio(last(e => together(e) && e.m === 'monsters')) >= GOOD, text: `${both} rustig: alles meteen goed` });
    ladder.push({ parts: all, ok: ratio(last(e => together(e) && e.m === 'monsters')) >= GOOD, text: `${both} met de ${mon}: minstens ${atLeast(all)} van ${count(all)} goed` });
    ladder.push({ parts: all, ok: ratio(last(e => together(e) && e.m === 'monsters')) >= 1, text: `${both} met de ${mon}: alles goed` });
    const i = ladder.findIndex(g => !g.ok);
    if (i >= 0) return { text: ladder[i].text, steps: ladder.length - i, parts: ladder[i].parts };
    return { parts: all, text: best ? `${both}: alles goed én sneller dan ${fmtTime(best)}` : `${both}: alles goed`, steps: 0 };
  }
  // fastest time for a set of parts (the times are kept per word list, see timeKey)
  function bestTimeOf(parts, m) {
    const keep = pickParts; pickParts = new Set(parts); const data = DATA;
    DATA = []; parts.forEach(i => { DATA = DATA.concat(PARTS[i] || []); });
    const t = bestTime(m); pickParts = keep; DATA = data; return t;
  }
  // The practice days, worked out again after every game (see the gap below). With many goals left and
  // few days: every day. The last one is always the day before the test. Returns { next: Date, days: [Date…] (up to the test), today: played today }.
  function practiceDays() {
    const log = planLog(), now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const test = daysToTest(), lastDay = test && test.d >= 1 ? addDays(test.day, -1) : null;
    const days = [...new Set(log.map(e => e.day))].sort();
    // every practice day gets its best result (part right first time); the gap to the next practice
    // follows from that: struggling = every day, good = every other day when it went up, perfect days in a
    // row = further apart, and a big jump forward earns an extra day
    const dayScore = d => Math.max(0, ...log.filter(e => e.day === d && !e.lost).map(e => e.good / Math.max(1, e.n)));
    const scores = days.map(dayScore), r = scores.length ? scores[scores.length - 1] : 0, prev = scores.length > 1 ? scores[scores.length - 2] : null;
    let streak = 0; for (let i = scores.length - 1; i >= 0 && scores[i] >= 1; i--) streak++;
    const GAPS = [2, 3, 4, 6];   // days until the next practice after 1, 2, 3, 4+ perfect days in a row
    let gap = r >= 1 ? GAPS[Math.min(streak, GAPS.length) - 1] : r >= GOOD && prev !== null && r > prev ? 2 : 1;
    if (prev !== null && r - prev >= 0.15 && r >= GOOD) gap++;
    const goal = nextGoal();
    if (lastDay && goal.steps >= dayDiff(today, lastDay)) gap = 1;     // much to do, little time: every day
    const played = days.length ? toDate(days[days.length - 1]) : null;
    let next = played ? addDays(played, gap) : today;
    if (next < today) next = today;
    if (lastDay && next > lastDay && today <= lastDay) next = lastDay;
    // the days after that, assuming every practice reaches its goal: one goal further each time and,
    // once the goals are reached, further apart; the day before the test is always a practice day
    const list = [next];
    if (lastDay && next < lastDay) {
      let d = next, s = streak, k = goal.steps;
      while (true) {
        s++; k = Math.max(0, k - 1);
        const g = k >= dayDiff(d, lastDay) ? 1 : k > 0 ? 1 + Math.min(1, s - 1) : GAPS[Math.min(s, GAPS.length) - 1];
        d = addDays(d, g);
        if (d >= lastDay) break;
        list.push(d);
      }
      list.push(lastDay);
    }
    return { next, days: list, today: !!played && +played === +today, goal, test, lastDay, todayDate: today };
  }
  // one line for the start and end screen
  function planTip() {
    const p = practiceDays(), g = p.goal.text;
    if (p.test && p.test.d === 0) return 'Vandaag is de toets. Je hebt goed geoefend! 🍀';
    if (p.today && p.lastDay && +p.todayDate === +p.lastDay) return 'Morgen is de toets. Je bent er klaar voor! 🍀';
    if (p.today && p.next > p.todayDate) {
      // the last game of today decides: good enough, or once more
      const log = planLog(), e = log[log.length - 1], ok = e && !e.lost && e.good / Math.max(1, e.n) >= GOOD;
      return ok ? `Klaar voor vandaag! 👍 Volgende keer ${dayName(p.next)}: ${g}` : `Nog een keer, vandaag of ${dayName(p.next)}: ${g}`;
    }
    if (p.next > p.todayDate) return `Je loopt voor op schema! Volgende oefendag ${dayName(p.next)}: ${g}`;
    return `Doel: ${g}`;
  }
  // the practice days until the test, e.g. "Oefendagen: zaterdag 28 november · dinsdag 1 december · …"
  function planDays() {
    const p = practiceDays(); if (!p.lastDay) return '';
    const names = p.days.map(dayName);
    // a long list: the first ones and the last one
    return 'Oefendagen: ' + (names.length > 6 ? [...names.slice(0, 4), '…', names[names.length - 1]] : names).join(' · ');
  }
  // the words that went wrong most often (only those in the chosen parts)
  function hardWords(max) {
    const hard = loadJson('words-hard-' + subjectKey(), {}), here = new Set(DATA.map(d => d.word));
    return Object.keys(hard).filter(w => here.has(w) && hard[w] >= 2).sort((a, b) => hard[b] - hard[a]).slice(0, max);
  }

  const app = document.getElementById('app');
  const vrBtn = document.getElementById('vr');
  const note = document.getElementById('note');

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  app.insertBefore(renderer.domElement, app.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
  const updateScenery = THEME.scene(THREE, scene);   // sky, ground and weather come from themes.js

  // ---------- canvas helpers ----------
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(ctx, text, maxW, size, weight) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > 14);
    return s;
  }
  function wrap(ctx, text, maxW) {
    const words = text.split(' '), lines = []; let line = '';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line); return lines;
  }
  // text in at most `maxLines` lines, shrinking the font until it fits
  function fitLines(ctx, text, maxW, maxLines, size, weight, minSize) {
    let s = size, lines;
    while (true) {
      ctx.font = `${weight} ${s}px ${FONT}`;
      lines = wrap(ctx, text, maxW);
      if ((lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW)) || s <= minSize) break;
      s -= 2;
    }
    return { lines: lines.slice(0, maxLines), size: s };
  }

  const interactive = [];
  function canvasPlane(w, h, cw) {
    const c = document.createElement('canvas'); c.width = cw; c.height = Math.round(cw * h / w);
    const ctx = c.getContext('2d'), tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, fog: false }));
    return { mesh, c, ctx, tex, update() { tex.needsUpdate = true; } };
  }
  const BTN_COLORS = C.btn;
  function makeButton(w, h, cw, maxLines) {
    const p = canvasPlane(w, h, cw);
    p.enabled = true; p.state = 'idle'; p.base = 1; p.maxLines = maxLines; p.mesh.userData.btn = p;
    p.draw = function (label, state) {
      this.state = state; this.label = label;
      const { ctx, c } = this, [a, b] = BTN_COLORS[state], r = Math.min(42, c.height * 0.3);
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(ctx, 8, 14, c.width - 16, c.height - 18, r); ctx.fill();
      const g = ctx.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, a); g.addColorStop(1, b);
      ctx.fillStyle = g; rr(ctx, 8, 6, c.width - 16, c.height - 20, r); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 5; ctx.stroke();
      ctx.fillStyle = state === 'start' ? C.startInk : '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const ml = this.maxLines || 1, inner = c.height - 34;
      const f = fitLines(ctx, label, c.width - 70, ml, Math.min(64, inner * (ml === 1 ? 0.62 : 0.4)), ml === 1 ? 900 : 800, 20);
      const lh = f.size * 1.12, y0 = (c.height - 14) / 2 + 2 - (f.lines.length - 1) * lh / 2;
      f.lines.forEach((l, i) => ctx.fillText(l, c.width / 2, y0 + i * lh));
      this.update();
    };
    interactive.push(p.mesh);
    return p;
  }
  // gives a button a new shape (same object, so everything that refers to it keeps working)
  function reshapeButton(b, w, h, cw, maxLines) {
    const p = canvasPlane(w, h, cw), i = interactive.indexOf(b.mesh), vis = b.mesh.visible;
    ui.remove(b.mesh); b.mesh.geometry.dispose(); b.tex.dispose(); b.mesh.material.dispose();
    Object.assign(b, { mesh: p.mesh, c: p.c, ctx: p.ctx, tex: p.tex, update: p.update, maxLines });
    b.mesh.userData.btn = b; b.mesh.visible = vis; interactive[i] = b.mesh; ui.add(b.mesh);
    if (b.label !== undefined) b.draw(b.label, b.state);
  }

  // ---------- game UI ----------
  const ui = new THREE.Group(); scene.add(ui);
  const Z = -2.4;
  // Two layouts: wide (computer, tablet, landscape, VR) and tall (phone held upright). In the tall one
  // the panel is narrower with bigger text and the answers are full-width buttons under each other.
  const S = canvasPlane(1.5, 0.19, 1024); ui.add(S.mesh);
  let Q = null, tall = false;
  function buildPanel() {
    if (Q) { ui.remove(Q.mesh); Q.mesh.geometry.dispose(); Q.tex.dispose(); Q.mesh.material.dispose(); }
    Q = tall ? canvasPlane(1.1, 1.0, 1024) : canvasPlane(1.8, 0.9, 1024);
    ui.add(Q.mesh);
  }
  const answerBtns = [];
  for (let i = 0; i < 4; i++) {

  renderer.domElement.addEventListener('pointermove', setMouse);
  renderer.domElement.addEventListener('pointerleave', () => { mouseIn = false; });
  renderer.domElement.addEventListener('pointerdown', e => {
    if (renderer.xr.isPresenting) return;
    ensureAudio(); setMouse(e); raycaster.setFromCamera(mouse, camera); selectHit(hitFromRay());
  });

  // ---------- VR session ----------
  let session = null, needsPlace = false;
  async function setupVR() {
    const isHeadset = /OculusBrowser|Quest|Pico|Wolvic/i.test(navigator.userAgent);
    let ok = false;
    if (isHeadset) { try { ok = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-vr')); } catch (e) {} }
    if (ok) { vrBtn.hidden = false; note.hidden = false; note.textContent = `Druk op "Speel in VR". Richt op een antwoord en gooi een ${W.ball} met de trekker.`; }
    else vrBtn.hidden = true;   // no VR: nothing to explain, kids know how to tap
  }
  vrBtn.addEventListener('click', async () => {
    ensureAudio();
    if (session) { session.end(); return; }
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
      s.addEventListener('end', () => { session = null; vrBtn.textContent = '🥽 Speel in VR'; ui.position.set(0, 0, 0); ui.rotation.set(0, 0, 0); resize(); });
      await renderer.xr.setSession(s);
      session = s; needsPlace = true; vrBtn.textContent = 'Stop VR'; checkLayout(); place();
    } catch (e) { note.hidden = false; note.textContent = 'VR start niet. Open deze pagina direct in de Meta Quest-browser.'; }
  });

  // ---------- layout / loop ----------
  // a phone held sideways gets "Draai je telefoon rechtop" (tablets, computers and VR don't)
  const turnEl = document.getElementById('turn');
  function checkTurn() {
    const phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
    turnEl.hidden = !(phone && innerWidth > innerHeight && !renderer.xr.isPresenting);
  }
  function resize() {
    checkTurn();
    const w = app.clientWidth, h = app.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    checkLayout();
    const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    if (mode === 'monsters' && phase === 'question') {
      const dist = Math.max(3.6, 0.9 / (tanHalf * camera.aspect));
      camera.position.set(0, 1.7, Z + dist);
      // the panel covers the top of the screen; tilt the camera up so the top of the
      // highest sign of a monster that's still far away (7 m) shows just under the panel
      camera.updateProjectionMatrix(); camera.lookAt(0, 1.7, Z - 10); placeHud();
      const far = Z + dist + 7 + (tall ? PHONE_BACK : 0), top = 1.38 + SIGN_H * (tall ? phoneSignScale(far) * 2.06 : 1.55);
      const elev = Math.atan2(top - 1.7, far), want = Math.atan((hudBottom - 0.03) * tanHalf);
      camera.lookAt(0, 1.7 + Math.tan(elev - want) * 10, Z + dist - 10); camera.updateProjectionMatrix();
      placeHud(); return;
    }
    if (tall) {
      // phone: from the lowest button up to the home button, 1.16 m wide
      const lo = phase === 'question' ? 0.6 : 0.76, hi = 3.32, mid = (lo + hi) / 2;
      const d = Math.max(((hi - lo) / 2) / tanHalf, (1.16 / 2) / (tanHalf * camera.aspect));
      camera.position.set(0, mid, Z + d); camera.lookAt(0, mid, Z); camera.updateProjectionMatrix(); return;
    }
    const dist = Math.max((2.35 / 2) / tanHalf, (1.9 / 2) / (tanHalf * camera.aspect));
    camera.position.set(0, 1.82, Z + dist); camera.lookAt(0, 1.84, Z); camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', () => { if (!renderer.xr.isPresenting) resize(); });
  resize();

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (renderer.xr.isPresenting && needsPlace) {
      const xc = renderer.xr.getCamera(camera); xc.getWorldPosition(tmpV);
      if (tmpV.y > 0.3) {
        xc.getWorldDirection(tmpD); ui.rotation.y = Math.atan2(-tmpD.x, -tmpD.z);
        ui.position.set(tmpV.x, Math.max(-0.7, Math.min(0.2, tmpV.y - 1.6)), tmpV.z); needsPlace = false;
      }
    }
    const hovered = new Set();
    if (renderer.xr.isPresenting) {
      controllers.forEach(c => {
        const { line, dot, src } = c.userData;
        if (!src) { line.visible = false; return; }
        line.visible = true; rayFromController(c);
        const hit = hitFromRay();
        if (hit) { hovered.add(hit.object); line.scale.z = hit.distance; dot.position.copy(hit.point); dot.visible = true; }
        else { line.scale.z = 4; dot.visible = false; }
      });
    } else if (mouseIn) {
      raycaster.setFromCamera(mouse, camera);
      const hit = hitFromRay(); if (hit) hovered.add(hit.object);
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
    interactive.forEach(m => {
      const b = m.userData.btn;
      let target = hovered.has(m) && b.state !== 'dim' && !locked ? 1.04 : 1;
      if (b === waitBtn) target = 1.03 + Math.sin(t * 7) * 0.025;
      target *= b.base;
      const s = m.scale.x + (target - m.scale.x) * Math.min(1, dt * 14); m.scale.set(s, s, 1);
    });
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i], v = p.userData.v;
      v.y -= 3.2 * dt; p.position.addScaledVector(v, dt); p.rotation.x += dt * 6; p.rotation.y += dt * 4;
      p.userData.life -= dt; p.material.opacity = Math.max(0, p.userData.life / 1.2);
      if (p.userData.life <= 0) { scene.remove(p); p.material.dispose(); parts.splice(i, 1); }
    }
    updateScenery(dt, t);
    if (phase === 'question') { const e = elapsed(); if (e !== lastShownSec) { lastShownSec = e; drawScore(); } }
    updateSnowballs(dt);
    updateCreatures(dt, t);
    renderer.render(scene, camera);
  });

  startSubject();
  showStart();
  setupVR();
}
</script>
</body>
