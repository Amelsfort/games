<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verkeersheld</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #8fd0ff; --fg: #10233f; --muted: #2c4a72;
    --accent: #ffcf40; --accent-ink: #3a2200; --chip: rgba(255, 255, 255, 0.85);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #10233f; --fg: #f3f7ff; --muted: #c9d8f2; --chip: rgba(8, 20, 52, 0.82); } }
  :root[data-theme="dark"] { --bg: #10233f; --fg: #f3f7ff; --muted: #c9d8f2; --chip: rgba(8, 20, 52, 0.82); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  #app { position: relative; width: 100%; height: 100%; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #vr { pointer-events: auto; font: 900 1.1rem/1 "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px;
    padding: 0.85em 1.5em; box-shadow: 0 4px 0 #b77900; cursor: pointer; }
  #vr:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #vr[hidden] { display: none; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255,250,220,0.95), rgba(255,170,40,0.55) 45%, rgba(255,60,0,0) 75%); }
  #flash.go { animation: flash 0.45s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #flash.go { animation-duration: 0.15s; } }
  #note { pointer-events: auto; margin: 0; max-width: 34rem; text-align: center; font-size: 0.92rem;
    line-height: 1.4; color: var(--muted); background: var(--chip); padding: 0.45em 0.9em; border-radius: 12px; transition: opacity 0.6s; }
  #note.gone { opacity: 0; }
  /* testers only (?all): the map of the whole route */
  /* testers only (?all): the map of the whole route, and a shortcut to every end scene */
  #testBar { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
  #testBar button, #endMenu button { pointer-events: auto; font: 800 0.95rem/1 "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 0.6em 1em; cursor: pointer; }
  #testBar[hidden], #mapBtn[hidden], #testMap[hidden], #endMenu[hidden] { display: none; }
  #testMap, #endMenu { position: absolute; top: 52px; right: 12px; width: min(340px, calc(100% - 24px)); background: var(--chip); color: var(--fg);
    border-radius: 14px; padding: 10px; font-size: 0.78rem; line-height: 1.35; }
  #endMenu { display: flex; flex-direction: column; gap: 6px; }
  #endMenu button { text-align: left; border-radius: 10px; background: rgba(255,255,255,0.08); }
  #testMap canvas { display: block; width: 100%; height: auto; }
  #testMap p { margin: 6px 2px 0; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div id="flash"></div>
  <div id="hud">
    <button id="vr" hidden>🥽 Speel in VR</button>
    <p id="note">Laden…</p>
  </div>
  <div id="testBar" hidden><button id="mapBtn" hidden>🗺️ Kaart</button><button id="endBtn">🏁 Eindscènes</button></div>
  <div id="endMenu" hidden></div>
  <div id="testMap" hidden><canvas width="680" height="680"></canvas>
    <p>Groen: de goede route · rood: afgesloten · bruin: zandpad · oranje: hier ben je · ⬜ kruising met een vraag · ◯ voorrangskruising</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="settings.js"></script>
<script src="themes.js"></script>
<script src="traffic-content.js"></script>
<script>
/* Visits and results go to your Google Sheet (tab 'verkeer'); the link is in settings.js.
   With ?all (testing: every level open) nothing is logged. Event and field names are the sheet's columns: keep them Dutch. */
const TESTING = new URLSearchParams(location.search).has('all');
const logGame = (e, extra) => { if (!TESTING && typeof logEvent === 'function') logEvent(e, Object.assign({ g: 'verkeer' }, extra)); };
logGame('bezoek');
</script>
<script>
(async function () {
  try { await Promise.all([document.fonts.load('900 64px Nunito'), document.fonts.load('800 48px Nunito'), document.fonts.load('700 40px Nunito')]); } catch (e) {}
  start();
})();

function start() {
  const FONT = '"Nunito", "Trebuchet MS", system-ui, sans-serif';
  const app = document.getElementById('app'), vrBtn = document.getElementById('vr'), note = document.getElementById('note');

  // ---------- content ----------
  const HAS_CONTENT = typeof LEVELS !== 'undefined' && Array.isArray(LEVELS);
  const SIGN_DEFS = (typeof SIGNS !== 'undefined' && Array.isArray(SIGNS) ? SIGNS : []).filter(b => b && b.id && b.meaning && b.family);
  const FAMS = typeof FAMILIES === 'object' && FAMILIES ? FAMILIES : {};
  const SITS = typeof SITUATIONS === 'object' && SITUATIONS ? SITUATIONS : {};
  const QS = {};
  if (typeof QUESTIONS === 'object' && QUESTIONS) for (const k in QUESTIONS) {
    const q = QUESTIONS[k];
    if (q && q.question && Array.isArray(q.answers) && q.answers.length >= 2 && q.answers.length <= 4 && q.answers[q.correct] !== undefined) QS[k] = q;
  }
  const RTS = typeof ROUTES === 'object' && ROUTES ? ROUTES : {};
  const LVLS = (HAS_CONTENT ? LEVELS : []).filter(l => l && l.id && l.enabled !== false).slice(0, 12);
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) { try { localStorage.removeItem('traffic-progress'); } catch (e) {} }
  const UNLOCK_ALL = TESTING;

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  app.insertBefore(renderer.domElement, app.firstChild);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.03, 200);
  const THEMED = typeof THEME === 'object' && THEME && typeof THEME.scene === 'function';
  const updateScenery = THEMED ? THEME.scene(THREE, scene) : null;   // sky, ground, lights and weather come from themes.js

  // ---------- buildings ----------
  // Walls get a repeating window pattern; roofs and the tops of boxes never do.
  const lam = c => new THREE.MeshLambertMaterial({ color: c });
  let rnd = Math.random;   // the scenery builders use this, so a scenery variant always looks the same
  // col: a colour, a material, or 6 materials (BoxGeometry faces: +x, -x, top, bottom, +z, -z)
  function box(g, w, h, d, col, x, z, y) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof col === 'number' ? lam(col) : col); m.position.set(x, (y || 0) + h / 2, z); g.add(m); return m; }
  // a box with rounded edges (r: the radius), same size as a box; geometries are shared
  const softGeos = {};
  function softGeo(w, h, d, r) {
    const key = [w, h, d, r].map(v => v.toFixed(3)).join(); if (softGeos[key]) return softGeos[key];
    r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001);
    const b = r * 0.6, sw = w - 2 * b, sh = h - 2 * b, rr = Math.max(0.001, Math.min(r - b, sw / 2 - 0.001, sh / 2 - 0.001));
    const s = new THREE.Shape(), x0 = -sw / 2, y0 = -sh / 2;
    s.moveTo(x0 + rr, y0); s.lineTo(x0 + sw - rr, y0); s.quadraticCurveTo(x0 + sw, y0, x0 + sw, y0 + rr); s.lineTo(x0 + sw, y0 + sh - rr);
    s.quadraticCurveTo(x0 + sw, y0 + sh, x0 + sw - rr, y0 + sh); s.lineTo(x0 + rr, y0 + sh); s.quadraticCurveTo(x0, y0 + sh, x0, y0 + sh - rr);
    s.lineTo(x0, y0 + rr); s.quadraticCurveTo(x0, y0, x0 + rr, y0);
    const geo = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 4 });
    geo.translate(0, 0, -Math.max(0.001, d - 2 * b) / 2); geo.computeVertexNormals();
    return softGeos[key] = geo;
  }
  // a round pole from point a to point b ([x, y, z])
  function rod(g, a, b, r, mat) {
    const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b), d = vb.clone().sub(va);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 10), mat);
    m.position.copy(va).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); g.add(m); return m;
  }
  // like box(), with rounded edges
  function soft(g, w, h, d, col, x, z, y, r) {
    const m = new THREE.Mesh(softGeo(w, h, d, r || Math.min(w, h, d) * 0.25), typeof col === 'number' ? lam(col) : col);
    m.position.set(x, (y || 0) + h / 2, z); g.add(m); return m;
  }
  const hex = c => '#' + c.toString(16).padStart(6, '0'), facades = {};
  // one window bay on a wall of colour col: 'house' a window with a white frame, 'office' two tall windows and a floor band
  function facade(kind, col) {
    const key = kind + col; if (facades[key]) return facades[key];
    const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    x.fillStyle = hex(col); x.fillRect(0, 0, 64, 64);
    if (kind === 'office') {
      x.fillStyle = 'rgba(0,0,0,0.12)'; x.fillRect(0, 56, 64, 8);
      [6, 36].forEach(u => { x.fillStyle = '#3d5675'; x.fillRect(u, 10, 22, 38); x.fillStyle = '#7f9cc2'; x.fillRect(u + 3, 13, 5, 32); x.fillStyle = '#e8e8e8'; x.fillRect(u, 27, 22, 2); });
    } else {
      x.fillStyle = '#f7f7f2'; x.fillRect(17, 14, 30, 32);
      x.fillStyle = '#4a6585'; x.fillRect(20, 17, 24, 26); x.fillStyle = '#86a3c4'; x.fillRect(22, 19, 6, 22);
      x.fillStyle = '#f7f7f2'; x.fillRect(31, 17, 2, 26); x.fillRect(20, 29, 24, 2);
      x.fillStyle = 'rgba(0,0,0,0.25)'; x.fillRect(14, 46, 36, 4);   // the sill
    }
    return facades[key] = c;
  }
  function wallMat(kind, col, bays, floors) {
    const t = new THREE.CanvasTexture(facade(kind, col)); t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(Math.max(1, Math.round(bays)), Math.max(1, Math.round(floors))); return new THREE.MeshLambertMaterial({ map: t });
  }
  // a box with windows on its sides and a plain top
  function building(g, w, h, d, kind, col, top, x, z, y) {
    const bay = kind === 'office' ? 1.0 : 0.75, floors = Math.max(1, Math.round(h / (kind === 'office' ? 0.9 : 1.0)));
    const sideX = wallMat(kind, col, d / bay, floors), sideZ = wallMat(kind, col, w / bay, floors), plain = lam(top);
    return box(g, w, h, d, [sideX, sideX, plain, plain, sideZ, sideZ], x, z, y);
  }
  // A pitched roof on a w × d building that's h high, centred on (x, z): rh high, the ridge along x,
  // with gable walls in the wall colour at both ends.
  function pitchedRoof(g, w, d, h, rh, wall, roof, x, z) {
    const r = new THREE.Group(); r.position.set(x || 0, h, z || 0); g.add(r);
    const tri = new THREE.Shape(); tri.moveTo(-d / 2, 0); tri.lineTo(d / 2, 0); tri.lineTo(0, rh); tri.lineTo(-d / 2, 0);
    const gable = new THREE.Mesh(new THREE.ExtrudeGeometry(tri, { depth: w, bevelEnabled: false }), lam(wall));
    gable.geometry.translate(0, 0, -w / 2); gable.rotation.y = Math.PI / 2; r.add(gable);
    const a = Math.atan2(rh, d / 2), L = Math.hypot(d / 2, rh) + 0.16, roofMat = lam(roof);
    [1, -1].forEach(s => {
      const slab = new THREE.Mesh(new THREE.BoxGeometry(w + 0.24, 0.07, L), roofMat);
      slab.rotation.x = s * a; slab.position.set(0, rh / 2 + 0.05, s * d / 4); r.add(slab);
    });
    return r;
  }
  // A house with a pitched roof: the ridge runs along x, the front door is on +z.
  function house(w, d, h, wall, roof, opts) {
    const g = new THREE.Group(), o = opts || {}, rh = o.roofH || d * 0.42;
    // Windows all round from the pattern, except the front: there they're separate, so none ends up behind the door.
    const bay = 0.75, floors = Math.max(1, Math.round(h)), fh = h / floors, door = o.doorX || 0;
    const side = wallMat('house', wall, d / bay, floors), plain = lam(wall);
    box(g, w, h, d, [side, side, plain, plain, plain, wallMat('house', wall, w / bay, floors)], 0, 0);
    const n = Math.max(1, Math.round(w / bay)), bw = w / n;
    for (let f = 0; f < floors; f++) for (let i = 0; i < n; i++) {
      const x = -w / 2 + (i + 0.5) * bw; if (f === 0 && Math.abs(x - door) < bw * 0.5 + 0.2) continue;
      const y = f * fh + fh * 0.28;   // the same place as in the pattern (the frame runs from 0.28 to 0.78 of a floor)
      box(g, bw * 0.47, fh * 0.5, 0.03, 0xf7f7f2, x, d / 2 + 0.01, y);
      box(g, bw * 0.38, fh * 0.4, 0.03, 0x4a6585, x, d / 2 + 0.02, y + fh * 0.05);
      box(g, bw * 0.56, 0.04, 0.07, 0xbdbdbd, x, d / 2 + 0.03, y - 0.04);   // the sill
    }
    pitchedRoof(g, w, d, h, rh, wall, roof);
    if (o.chimney !== false) box(g, 0.2, rh * 0.75 + 0.1, 0.2, 0x8a4b3a, w * 0.28, -d * 0.22, h + rh * 0.45);
    box(g, 0.34, 0.62, 0.04, o.doorCol || 0x6d4c33, door, d / 2 + 0.01);
    box(g, 0.44, 0.04, 0.12, 0xbdbdbd, door, d / 2 + 0.06);   // the step
    return g;
  }

  (function environment() {
    if (!THEMED) {   // no themes.js: a sunny day
      scene.fog = new THREE.Fog(0xcfeaff, 25, 90);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8a4a, 0.95));
      const sun = new THREE.DirectionalLight(0xfff4dc, 0.65); sun.position.set(5, 12, 4); scene.add(sun);
      const c = document.createElement('canvas'); c.width = 8; c.height = 256;
      const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0, '#3d9be9'); g.addColorStop(0.45, '#8fd0ff'); g.addColorStop(0.5, '#e4f6ff'); g.addColorStop(1, '#e4f6ff');
      x.fillStyle = g; x.fillRect(0, 0, 8, 256);
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.BackSide, fog: false })));
      const ground = new THREE.Mesh(new THREE.CircleGeometry(80, 48), new THREE.MeshLambertMaterial({ color: 0x8cc66a }));
      ground.rotation.x = -Math.PI / 2; scene.add(ground);
    }
    // the village around the crossing is always there
    const wall = [0xf2e3c9, 0xd9a07a, 0xf7f2ea, 0xc9d7e8, 0xe8c07a], roof = [0x9c3b2e, 0x5b5b66, 0x7a4a2a];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + Math.random() * 0.2, r = 11 + Math.random() * 7;
      const w = 2 + Math.random() * 1.5, d = 2 + Math.random(), ht = 1.8 + Math.random() * 1.2;
      const h = house(w, d, ht, wall[i % wall.length], roof[i % roof.length], { doorX: (Math.random() - 0.5) * w * 0.5 });
      h.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); h.lookAt(0, 0, 0); scene.add(h);   // the front door faces the crossing
    }
    if (THEMED) return;   // the theme brings its own trees
    const trunk = new THREE.MeshLambertMaterial({ color: 0x6b4423 }), leaf = new THREE.MeshLambertMaterial({ color: 0x3f8f3a });
    for (let i = 0; i < 30; i++) {
      const a = Math.random() * 6.283, r = 7 + Math.random() * 20, s = 0.8 + Math.random() * 0.8, t = new THREE.Group();
      const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * s, 0.14 * s, 1.2 * s, 6), trunk); tr.position.y = 0.6 * s; t.add(tr);
      const cr = new THREE.Mesh(new THREE.SphereGeometry(0.8 * s, 10, 8), leaf); cr.position.y = 1.7 * s; t.add(cr);
      t.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); scene.add(t);
    }
  })();

  // ---------- canvas helpers ----------
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(ctx, text, maxW, size, weight) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > 14);
    return s;
  }
  function wrap(ctx, text, maxW) {
    const out = [];
    String(text).split('\n').forEach(par => {
      const words = par.split(' '); let line = '';
      words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
      out.push(line);
    });
    return out;
  }
  function fitLines(ctx, text, maxW, maxLines, size, weight, minSize) {
    let s = size, lines;
    while (true) {
      ctx.font = `${weight} ${s}px ${FONT}`; lines = wrap(ctx, text, maxW);
      if ((lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW)) || s <= minSize) break;
      s -= 2;
    }
    return { lines: lines.slice(0, maxLines), size: s };
  }
  // text in the band from top to bottom: as big as fits (down to minSize), centred in the band
  function drawInBand(ctx, text, x, maxW, top, bottom, size, weight, minSize) {
    let s = size, lines;
    for (; ; s -= 2) {
      ctx.font = `${weight} ${s}px ${FONT}`; lines = wrap(ctx, text, maxW);
      if (s <= minSize || ((lines.length - 1) * s * 1.22 + s <= bottom - top && lines.every(l => ctx.measureText(l).width <= maxW))) break;
    }
    const lh = s * 1.22, n = Math.max(1, Math.min(lines.length, Math.floor((bottom - top - s) / lh) + 1));
    drawLines(ctx, { lines: lines.slice(0, n), size: s }, x, (top + bottom) / 2, lh);
  }
  function drawLines(ctx, f, x, yCenter, lh) {
    const h = (f.lines.length - 1) * lh, y0 = yCenter - h / 2;
    f.lines.forEach((l, i) => ctx.fillText(l, x, y0 + i * lh));
  }

  // ---------- Dutch traffic signs, drawn in code ----------
  const RED = '#d0202a', BLUE = '#1d5fb4', BLACK = '#111111', WHITE = '#ffffff', ORANGE = '#f6a400';
  function poly(ctx, pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
  function disc(ctx, x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); }
  function picCar(ctx, x, y, s, col) {
    ctx.fillStyle = col;
    rr(ctx, x - s * 0.9, y - s * 0.08, s * 1.8, s * 0.42, s * 0.12); ctx.fill();
    poly(ctx, [[x - s * 0.55, y - s * 0.06], [x - s * 0.33, y - s * 0.46], [x + s * 0.32, y - s * 0.46], [x + s * 0.6, y - s * 0.06]]); ctx.fill();
    disc(ctx, x - s * 0.52, y + s * 0.36, s * 0.2, col); disc(ctx, x + s * 0.52, y + s * 0.36, s * 0.2, col);
  }
  function picBike(ctx, x, y, s, col) {
    ctx.strokeStyle = col; ctx.lineWidth = s * 0.1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const rw = s * 0.36, ly = y + s * 0.22, lx = x - s * 0.58, fx = x + s * 0.58;
    [lx, fx].forEach(cx => { ctx.beginPath(); ctx.arc(cx, ly, rw, 0, Math.PI * 2); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x - s * 0.05, ly); ctx.lineTo(x + s * 0.3, y - s * 0.28); ctx.lineTo(x - s * 0.22, y - s * 0.28); ctx.lineTo(x - s * 0.05, ly);
    ctx.moveTo(lx, ly); ctx.lineTo(x - s * 0.22, y - s * 0.28); ctx.moveTo(fx, ly); ctx.lineTo(x + s * 0.36, y - s * 0.46); ctx.lineTo(x + s * 0.5, y - s * 0.46);
    ctx.moveTo(x - s * 0.3, y - s * 0.4); ctx.lineTo(x - s * 0.12, y - s * 0.4); ctx.stroke();
  }
  function picPed(ctx, x, y, s, col) {

      const f = Math.min(0.4, document.getElementById('hud').offsetHeight / Math.max(1, h));
      const dist = Math.max((2.2 / (1 - f) / 2) / tanHalf, (2.0 / 2) / (tanHalf * camera.aspect)), cy = 1.67 - f * dist * tanHalf;
      camera.position.set(0, cy - 0.02, Z + dist); camera.lookAt(0, cy, Z);
    }
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', applyCamera);

  // ---------- loop ----------
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (renderer.xr.isPresenting && needsPlace) {
      const xc = renderer.xr.getCamera(camera); xc.getWorldPosition(tmpV);
      if (tmpV.y > 0.3) {
        xc.getWorldDirection(tmpD); ui.rotation.y = Math.atan2(-tmpD.x, -tmpD.z);
        ui.position.set(tmpV.x, Math.max(-0.7, Math.min(0.2, tmpV.y - 1.6)), tmpV.z); needsPlace = false;
      }
    }
    const hovered = new Set();
    if (renderer.xr.isPresenting) {
      controllers.forEach(c => {
        const { line, dot, src } = c.userData;
        if (!src) { line.visible = false; return; }
        line.visible = true; rayFrom(c);
        const hit = hitFromRay();
        if (hit) { hovered.add(hit.object); line.scale.z = hit.distance; dot.position.copy(hit.point); dot.visible = true; }
        else { line.scale.z = 4; dot.visible = false; }
      });
    } else if (mouseIn) {
      raycaster.setFromCamera(mouse, camera);
      const hit = hitFromRay(); if (hit) hovered.add(hit.object);
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
    parts.forEach(p => { p.hover = hovered.has(p.hit); });
    interactive.forEach(m => {
      const b = m.userData.btn;
      let target = hovered.has(m) && !['dim', 'lock'].includes(b.state) && !locked ? 1.05 : 1;
      if (b === waitBtn) target = 1.04 + Math.sin(t * 7) * 0.03;
      const s = m.scale.x + (target - m.scale.x) * Math.min(1, dt * 14); m.scale.set(s, s, 1);
    });
    updateMovers(dt, t);
    if (phase === 'crossing') {   // the road signs of a route stop always face you, also when you turn the table
      const cp = renderer.xr.isPresenting ? renderer.xr.getCamera(camera).getWorldPosition(camW) : camera.position;
      routeBtns.forEach(b => { if (b.mesh.visible) b.mesh.lookAt(cp); });
    }
    if (updateScenery) updateScenery(dt, t);
    if (camShake > 0 && !renderer.xr.isPresenting) {
      camShake -= dt; applyCamera();
      if (camShake > 0) { const a = 0.06 * camShake; camera.position.x += (Math.random() - 0.5) * a; camera.position.y += (Math.random() - 0.5) * a; }
    }
    if ((phase === 'quiz' || phase === 'crossing') && elapsed() !== lastSec) { lastSec = elapsed(); drawScore(); }
    renderer.render(scene, camera);
  });

  showMap();
  setupVR();
}
</script>
</body>
