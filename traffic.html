<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verkeersheld</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #8fd0ff; --fg: #10233f; --muted: #2c4a72;
    --accent: #ffcf40; --accent-ink: #3a2200; --chip: rgba(255, 255, 255, 0.85);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #10233f; --fg: #f3f7ff; --muted: #c9d8f2; --chip: rgba(8, 20, 52, 0.82); } }
  :root[data-theme="dark"] { --bg: #10233f; --fg: #f3f7ff; --muted: #c9d8f2; --chip: rgba(8, 20, 52, 0.82); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  #app { position: relative; width: 100%; height: 100%; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #vr { pointer-events: auto; font: 900 1.1rem/1 "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px;
    padding: 0.85em 1.5em; box-shadow: 0 4px 0 #b77900; cursor: pointer; }
  #vr:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #vr[hidden] { display: none; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255,250,220,0.95), rgba(255,170,40,0.55) 45%, rgba(255,60,0,0) 75%); }
  #flash.go { animation: flash 0.45s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #flash.go { animation-duration: 0.15s; } }
  #note { pointer-events: auto; margin: 0; max-width: 34rem; text-align: center; font-size: 0.92rem;
    line-height: 1.4; color: var(--muted); background: var(--chip); padding: 0.45em 0.9em; border-radius: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="flash"></div>
  <div id="hud">
    <button id="vr" hidden>🥽 Speel in VR</button>
    <p id="note">Laden…</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="settings.js"></script>
<script src="themes.js"></script>
<script src="traffic-content.js"></script>
<script>
/* Bezoeken en resultaten in je Google Sheet (tab 'verkeer'); de link staat in settings.js.
   Met ?alles (testen: alle levels open) wordt niets gelogd. */
const TESTING = new URLSearchParams(location.search).has('alles');
const logGame = (e, extra) => { if (!TESTING && typeof logEvent === 'function') logEvent(e, Object.assign({ g: 'verkeer' }, extra)); };
logGame('bezoek');
</script>
<script>
(async function () {
  try { await Promise.all([document.fonts.load('900 64px Nunito'), document.fonts.load('800 48px Nunito'), document.fonts.load('700 40px Nunito')]); } catch (e) {}
  start();
})();

function start() {
  const FONT = '"Nunito", "Trebuchet MS", system-ui, sans-serif';
  const app = document.getElementById('app'), vrBtn = document.getElementById('vr'), note = document.getElementById('note');

  // ---------- content ----------
  const HAS_CONTENT = typeof LEVELS !== 'undefined' && Array.isArray(LEVELS);
  const SIGNS = (typeof BORDEN !== 'undefined' && Array.isArray(BORDEN) ? BORDEN : []).filter(b => b && b.id && b.betekenis && b.familie);
  const FAMS = typeof FAMILIES === 'object' && FAMILIES ? FAMILIES : {};
  const SITS = typeof SITUATIES === 'object' && SITUATIES ? SITUATIES : {};
  const LVLS = (HAS_CONTENT ? LEVELS : []).filter(l => l && l.id && l.aan !== false).slice(0, 12);
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) { try { localStorage.removeItem('verkeer-voortgang'); } catch (e) {} }
  const UNLOCK_ALL = TESTING;

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  app.insertBefore(renderer.domElement, app.firstChild);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.03, 200);
  const THEMED = typeof THEMA === 'object' && THEMA && typeof THEMA.scene === 'function';
  const updateScenery = THEMED ? THEMA.scene(THREE, scene) : null;   // sky, ground, lights and weather come from themes.js

  (function environment() {
    if (!THEMED) {   // no themes.js: a sunny day
      scene.fog = new THREE.Fog(0xcfeaff, 25, 90);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8a4a, 0.95));
      const sun = new THREE.DirectionalLight(0xfff4dc, 0.65); sun.position.set(5, 12, 4); scene.add(sun);
      const c = document.createElement('canvas'); c.width = 8; c.height = 256;
      const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0, '#3d9be9'); g.addColorStop(0.45, '#8fd0ff'); g.addColorStop(0.5, '#e4f6ff'); g.addColorStop(1, '#e4f6ff');
      x.fillStyle = g; x.fillRect(0, 0, 8, 256);
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.BackSide, fog: false })));
      const ground = new THREE.Mesh(new THREE.CircleGeometry(80, 48), new THREE.MeshLambertMaterial({ color: 0x8cc66a }));
      ground.rotation.x = -Math.PI / 2; scene.add(ground);
    }
    // the village around the crossing is always there
    const wall = [0xf2e3c9, 0xd9a07a, 0xf7f2ea, 0xc9d7e8, 0xe8c07a], roof = [0x9c3b2e, 0x5b5b66, 0x7a4a2a];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + Math.random() * 0.2, r = 11 + Math.random() * 7;
      const h = new THREE.Group(), w = 2 + Math.random() * 1.5, d = 2 + Math.random(), ht = 1.8 + Math.random() * 1.2;
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, ht, d), new THREE.MeshLambertMaterial({ color: wall[i % wall.length] })); body.position.y = ht / 2; h.add(body);
      const rf = new THREE.Mesh(new THREE.CylinderGeometry(0.01, d * 0.75, 1.2, 4, 1), new THREE.MeshLambertMaterial({ color: roof[i % roof.length] }));
      rf.scale.x = w / d; rf.rotation.y = Math.PI / 4; rf.position.y = ht + 0.6; h.add(rf);
      h.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); h.lookAt(0, 0, 0); scene.add(h);
    }
    if (THEMED) return;   // the theme brings its own trees
    const trunk = new THREE.MeshLambertMaterial({ color: 0x6b4423 }), leaf = new THREE.MeshLambertMaterial({ color: 0x3f8f3a });
    for (let i = 0; i < 30; i++) {
      const a = Math.random() * 6.283, r = 7 + Math.random() * 20, s = 0.8 + Math.random() * 0.8, t = new THREE.Group();
      const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * s, 0.14 * s, 1.2 * s, 6), trunk); tr.position.y = 0.6 * s; t.add(tr);
      const cr = new THREE.Mesh(new THREE.SphereGeometry(0.8 * s, 10, 8), leaf); cr.position.y = 1.7 * s; t.add(cr);
      t.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); scene.add(t);
    }
  })();

  // ---------- canvas helpers ----------
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(ctx, text, maxW, size, weight) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > 14);
    return s;
  }
  function wrap(ctx, text, maxW) {
    const out = [];
    String(text).split('\n').forEach(par => {
      const words = par.split(' '); let line = '';
      words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
      out.push(line);
    });
    return out;
  }
  function fitLines(ctx, text, maxW, maxLines, size, weight, minSize) {
    let s = size, lines;
    while (true) {
      ctx.font = `${weight} ${s}px ${FONT}`; lines = wrap(ctx, text, maxW);
      if ((lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW)) || s <= minSize) break;
      s -= 2;
    }
    return { lines: lines.slice(0, maxLines), size: s };
  }
  function drawLines(ctx, f, x, yCenter, lh) {
    const h = (f.lines.length - 1) * lh, y0 = yCenter - h / 2;
    f.lines.forEach((l, i) => ctx.fillText(l, x, y0 + i * lh));
  }

  // ---------- Dutch traffic signs, drawn in code ----------
  const RED = '#d0202a', BLUE = '#1d5fb4', BLACK = '#111111', WHITE = '#ffffff', ORANGE = '#f6a400';
  function poly(ctx, pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
  function disc(ctx, x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); }
  function picCar(ctx, x, y, s, col) {
    ctx.fillStyle = col;
    rr(ctx, x - s * 0.9, y - s * 0.08, s * 1.8, s * 0.42, s * 0.12); ctx.fill();
    poly(ctx, [[x - s * 0.55, y - s * 0.06], [x - s * 0.33, y - s * 0.46], [x + s * 0.32, y - s * 0.46], [x + s * 0.6, y - s * 0.06]]); ctx.fill();
    disc(ctx, x - s * 0.52, y + s * 0.36, s * 0.2, col); disc(ctx, x + s * 0.52, y + s * 0.36, s * 0.2, col);
  }
  function picBike(ctx, x, y, s, col) {
    ctx.strokeStyle = col; ctx.lineWidth = s * 0.1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const rw = s * 0.36, ly = y + s * 0.22, lx = x - s * 0.58, fx = x + s * 0.58;
    [lx, fx].forEach(cx => { ctx.beginPath(); ctx.arc(cx, ly, rw, 0, Math.PI * 2); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x - s * 0.05, ly); ctx.lineTo(x + s * 0.3, y - s * 0.28); ctx.lineTo(x - s * 0.22, y - s * 0.28); ctx.lineTo(x - s * 0.05, ly);
    ctx.moveTo(lx, ly); ctx.lineTo(x - s * 0.22, y - s * 0.28); ctx.moveTo(fx, ly); ctx.lineTo(x + s * 0.36, y - s * 0.46); ctx.lineTo(x + s * 0.5, y - s * 0.46);
    ctx.moveTo(x - s * 0.3, y - s * 0.4); ctx.lineTo(x - s * 0.12, y - s * 0.4); ctx.stroke();
  }
  function picPed(ctx, x, y, s, col) {
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    disc(ctx, x + s * 0.04, y - s * 0.7, s * 0.15, col);
    ctx.beginPath(); ctx.moveTo(x, y - s * 0.48); ctx.lineTo(x - s * 0.04, y + s * 0.08);
    ctx.moveTo(x - s * 0.04, y + s * 0.08); ctx.lineTo(x - s * 0.28, y + s * 0.7); ctx.moveTo(x - s * 0.04, y + s * 0.08); ctx.lineTo(x + s * 0.24, y + s * 0.7);
    ctx.moveTo(x, y - s * 0.4); ctx.lineTo(x - s * 0.3, y - s * 0.05); ctx.moveTo(x, y - s * 0.4); ctx.lineTo(x + s * 0.28, y - s * 0.1); ctx.stroke();
  }
  function arrow(ctx, pts, w, col) {
    const [ax, ay] = pts[pts.length - 2], [bx, by] = pts[pts.length - 1], a = Math.atan2(by - ay, bx - ax), h = w * 1.6;
    const shaft = pts.slice(0, -1).concat([[bx - Math.cos(a) * h * 1.1, by - Math.sin(a) * h * 1.1]]);
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    ctx.beginPath(); shaft.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    ctx.fillStyle = col; poly(ctx, [[bx, by], [bx - Math.cos(a) * h * 1.2 + Math.sin(a) * h, by - Math.sin(a) * h * 1.2 - Math.cos(a) * h], [bx - Math.cos(a) * h * 1.2 - Math.sin(a) * h, by - Math.sin(a) * h * 1.2 + Math.cos(a) * h]]); ctx.fill();
  }
  function ringSign(ctx, x, y, R, inner) {
    disc(ctx, x, y, R, RED); disc(ctx, x, y, R * 0.78, inner || WHITE);
    ctx.lineWidth = R * 0.03; ctx.strokeStyle = WHITE; ctx.beginPath(); ctx.arc(x, y, R * 0.985, 0, Math.PI * 2); ctx.stroke();
  }
  function blueDisc(ctx, x, y, R) { disc(ctx, x, y, R, WHITE); disc(ctx, x, y, R * 0.93, BLUE); }
  function triangle(ctx, x, y, R, down) {
    const k = down ? -1 : 1, pts = s => [[x, y - k * R * s], [x + R * 1.0 * s, y + k * R * 0.78 * s], [x - R * 1.0 * s, y + k * R * 0.78 * s]];
    ctx.lineJoin = 'round';
    poly(ctx, pts(1.02)); ctx.fillStyle = WHITE; ctx.fill(); ctx.lineWidth = R * 0.08; ctx.strokeStyle = WHITE; ctx.stroke();
    poly(ctx, pts(0.94)); ctx.fillStyle = RED; ctx.fill();
    poly(ctx, pts(0.62)); ctx.fillStyle = WHITE; ctx.fill();
    return y + k * R * 0.12;   // visual centre of the white area
  }
  function blueSquare(ctx, x, y, R) {
    ctx.fillStyle = WHITE; rr(ctx, x - R, y - R, R * 2, R * 2, R * 0.12); ctx.fill();
    ctx.fillStyle = BLUE; rr(ctx, x - R * 0.92, y - R * 0.92, R * 1.84, R * 1.84, R * 0.08); ctx.fill();
  }
  function diamond(ctx, x, y, R, stripes) {
    const d = s => [[x, y - R * s], [x + R * s, y], [x, y + R * s], [x - R * s, y]];
    poly(ctx, d(1)); ctx.fillStyle = BLACK; ctx.fill();
    poly(ctx, d(0.95)); ctx.fillStyle = WHITE; ctx.fill();
    poly(ctx, d(0.6)); ctx.fillStyle = ORANGE; ctx.fill(); ctx.lineWidth = R * 0.03; ctx.strokeStyle = BLACK; ctx.stroke();
    if (stripes) {
      ctx.save(); poly(ctx, d(0.95)); ctx.clip();
      ctx.strokeStyle = BLACK; ctx.lineWidth = R * 0.09;
      [-0.35, 0, 0.35].forEach(o => { ctx.beginPath(); ctx.moveTo(x - R + o * R, y + R + o * R); ctx.lineTo(x + R + o * R, y - R + o * R); ctx.stroke(); });
      ctx.restore();
    }
  }
  const SIGN_DRAW = {
    'verboden-in-te-rijden': (c, x, y, R) => { disc(c, x, y, R, WHITE); disc(c, x, y, R * 0.95, RED); c.fillStyle = WHITE; c.fillRect(x - R * 0.68, y - R * 0.17, R * 1.36, R * 0.34); },
    'gesloten': (c, x, y, R) => ringSign(c, x, y, R),
    'verboden-fietsers': (c, x, y, R) => { ringSign(c, x, y, R); picBike(c, x, y, R * 0.55, BLACK); },
    'verboden-autos': (c, x, y, R) => { ringSign(c, x, y, R); picCar(c, x, y + R * 0.02, R * 0.58, BLACK); },
    'verboden-voetgangers': (c, x, y, R) => { ringSign(c, x, y, R); picPed(c, x, y, R * 0.6, BLACK); },
    'max-30': (c, x, y, R) => { ringSign(c, x, y, R); c.fillStyle = BLACK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `900 ${R * 0.85}px ${FONT}`; c.fillText('30', x, y + R * 0.04); },
    'parkeerverbod': (c, x, y, R) => { ringSign(c, x, y, R, BLUE); c.save(); c.beginPath(); c.arc(x, y, R * 0.78, 0, Math.PI * 2); c.clip(); c.strokeStyle = RED; c.lineWidth = R * 0.2; c.beginPath(); c.moveTo(x - R, y - R); c.lineTo(x + R, y + R); c.stroke(); c.restore(); },
    'stopverbod': (c, x, y, R) => { ringSign(c, x, y, R, BLUE); c.save(); c.beginPath(); c.arc(x, y, R * 0.78, 0, Math.PI * 2); c.clip(); c.strokeStyle = RED; c.lineWidth = R * 0.2; c.beginPath(); c.moveTo(x - R, y - R); c.lineTo(x + R, y + R); c.moveTo(x + R, y - R); c.lineTo(x - R, y + R); c.stroke(); c.restore(); },
    'fietspad': (c, x, y, R) => { blueDisc(c, x, y, R); picBike(c, x, y, R * 0.55, WHITE); },
    'voetpad': (c, x, y, R) => { blueDisc(c, x, y, R); picPed(c, x, y, R * 0.6, WHITE); },
    'rechtdoor': (c, x, y, R) => { blueDisc(c, x, y, R); arrow(c, [[x, y + R * 0.6], [x, y - R * 0.6]], R * 0.22, WHITE); },
    'rechtsaf': (c, x, y, R) => { blueDisc(c, x, y, R); arrow(c, [[x - R * 0.25, y + R * 0.6], [x - R * 0.25, y - R * 0.05], [x + R * 0.62, y - R * 0.05]], R * 0.22, WHITE); },
    'let-op-kruispunt': (c, x, y, R) => { const cy = triangle(c, x, y, R); c.fillStyle = BLACK; c.fillRect(x - R * 0.07, cy - R * 0.33, R * 0.14, R * 0.6); c.fillRect(x - R * 0.3, cy - R * 0.1, R * 0.6, R * 0.14); },
    'let-op-kinderen': (c, x, y, R) => { const cy = triangle(c, x, y, R); picPed(c, x - R * 0.14, cy, R * 0.34, BLACK); picPed(c, x + R * 0.17, cy + R * 0.07, R * 0.26, BLACK); },
    'let-op-verkeerslichten': (c, x, y, R) => { const cy = triangle(c, x, y, R); c.fillStyle = BLACK; rr(c, x - R * 0.14, cy - R * 0.34, R * 0.28, R * 0.62, R * 0.06); c.fill(); [RED, ORANGE, '#1f9d3a'].forEach((col, i) => disc(c, x, cy - R * 0.23 + i * R * 0.2, R * 0.07, col)); },
    'let-op-zebrapad': (c, x, y, R) => { const cy = triangle(c, x, y, R); picPed(c, x, cy - R * 0.03, R * 0.32, BLACK); c.fillStyle = BLACK; for (let i = 0; i < 4; i++) c.fillRect(x - R * 0.4 + i * R * 0.22, cy + R * 0.28, R * 0.13, R * 0.06); },
    'let-op-fietsers': (c, x, y, R) => { const cy = triangle(c, x, y, R); picBike(c, x, cy + R * 0.06, R * 0.38, BLACK); },
    'haaientanden': (c, x, y, R) => { triangle(c, x, y, R, true); },
    'stop': (c, x, y, R) => {
      const oct = s => Array.from({ length: 8 }, (_, i) => { const a = Math.PI / 8 + i * Math.PI / 4; return [x + Math.cos(a) * R * s, y + Math.sin(a) * R * s]; });
      poly(c, oct(1)); c.fillStyle = WHITE; c.fill(); poly(c, oct(0.93)); c.fillStyle = RED; c.fill();
      c.fillStyle = WHITE; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `900 ${R * 0.52}px ${FONT}`; c.fillText('STOP', x, y + R * 0.03);
    },
    'voorrangsweg': (c, x, y, R) => diamond(c, x, y, R, false),
    'einde-voorrangsweg': (c, x, y, R) => diamond(c, x, y, R, true),
    'voorrangskruispunt': (c, x, y, R) => { const cy = triangle(c, x, y, R); c.fillStyle = BLACK; c.fillRect(x - R * 0.09, cy - R * 0.33, R * 0.18, R * 0.62); c.fillRect(x - R * 0.32, cy - R * 0.02, R * 0.64, R * 0.05); },
    'zebrapad': (c, x, y, R) => {
      blueSquare(c, x, y, R); poly(c, [[x, y - R * 0.72], [x + R * 0.75, y + R * 0.62], [x - R * 0.75, y + R * 0.62]]); c.fillStyle = WHITE; c.fill();
      picPed(c, x, y + R * 0.03, R * 0.33, BLACK); c.fillStyle = BLACK; for (let i = 0; i < 4; i++) c.fillRect(x - R * 0.42 + i * R * 0.24, y + R * 0.43, R * 0.14, R * 0.07);
    },
    'parkeren': (c, x, y, R) => { blueSquare(c, x, y, R); c.fillStyle = WHITE; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `900 ${R * 1.25}px ${FONT}`; c.fillText('P', x, y + R * 0.08); },
    'doodlopend': (c, x, y, R) => { blueSquare(c, x, y, R); c.fillStyle = WHITE; c.fillRect(x - R * 0.13, y - R * 0.3, R * 0.26, R * 0.95); c.fillStyle = RED; c.fillRect(x - R * 0.5, y - R * 0.62, R * 1.0, R * 0.3); },
    'eenrichtingsweg': (c, x, y, R) => { blueSquare(c, x, y, R); arrow(c, [[x - R * 0.62, y], [x + R * 0.62, y]], R * 0.24, WHITE); },
  };

  function applyCamera() {
    if (renderer.xr.isPresenting) return;
    const w = app.clientWidth, h = app.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    if (phase === 'kruis') {
      const target = new THREE.Vector3(0, 1.05, -1.5), dir = new THREE.Vector3(0, Math.sin(camPitch), Math.cos(camPitch));
      const dist = Math.max(1.75, 0.85 / (tanHalf * camera.aspect));
      camera.position.copy(target).addScaledVector(dir, dist); camera.lookAt(target);
    } else {
      const dist = Math.max((2.2 / 2) / tanHalf, (2.0 / 2) / (tanHalf * camera.aspect));
      camera.position.set(0, 1.65, Z + dist); camera.lookAt(0, 1.67, Z);
    }
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', applyCamera);

  // ---------- loop ----------
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (renderer.xr.isPresenting && needsPlace) {
      const xc = renderer.xr.getCamera(camera); xc.getWorldPosition(tmpV);
      if (tmpV.y > 0.3) {
        xc.getWorldDirection(tmpD); ui.rotation.y = Math.atan2(-tmpD.x, -tmpD.z);
        ui.position.set(tmpV.x, Math.max(-0.7, Math.min(0.2, tmpV.y - 1.6)), tmpV.z); needsPlace = false;
      }
    }
    const hovered = new Set();
    if (renderer.xr.isPresenting) {
      controllers.forEach(c => {
        const { line, dot, src } = c.userData;
        if (!src) { line.visible = false; return; }
        line.visible = true; rayFrom(c);
        const hit = hitFromRay();
        if (hit) { hovered.add(hit.object); line.scale.z = hit.distance; dot.position.copy(hit.point); dot.visible = true; }
        else { line.scale.z = 4; dot.visible = false; }
      });
    } else if (mouseIn) {
      raycaster.setFromCamera(mouse, camera);
      const hit = hitFromRay(); if (hit) hovered.add(hit.object);
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
    parts.forEach(p => { p.hover = hovered.has(p.hit); });
    interactive.forEach(m => {
      const b = m.userData.btn;
      let target = hovered.has(m) && !['dim', 'lock'].includes(b.state) && !locked ? 1.05 : 1;
      if (b === waitBtn) target = 1.04 + Math.sin(t * 7) * 0.03;
      const s = m.scale.x + (target - m.scale.x) * Math.min(1, dt * 14); m.scale.set(s, s, 1);
    });
    updateMovers(dt, t);
    if (updateScenery) updateScenery(dt, t);
    if (camShake > 0 && !renderer.xr.isPresenting) {
      camShake -= dt; applyCamera();
      if (camShake > 0) { const a = 0.06 * camShake; camera.position.x += (Math.random() - 0.5) * a; camera.position.y += (Math.random() - 0.5) * a; }
    }
    if ((phase === 'quiz' || phase === 'kruis') && elapsed() !== lastSec) { lastSec = elapsed(); drawScore(); }
    renderer.render(scene, camera);
  });

  showMap();
  setupVR();
}
</script>
